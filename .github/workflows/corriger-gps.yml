name: GPS terrain v3.77

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correction:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifier les fichiers
        run: |
          test -f index_v3.html || {
            echo "ERREUR : index_v3.html introuvable"
            exit 1
          }

          test -f corriger_gps_terrain_v377.py || {
            echo "ERREUR : corriger_gps_terrain_v377.py introuvable"
            exit 1
          }

      - name: Verifier le script
        run: |
          python -m py_compile corriger_gps_terrain_v377.py

      - name: Corriger le HTML
        run: |
          python corriger_gps_terrain_v377.py

      - name: Verifier la correction
        run: |
          grep -q "v3.77-gps-terrain" index_v3.html
          grep -q "GPS TERRAIN v3.77" index_v3.html
          grep -q "GPS.marker.setLngLat" index_v3.html
          grep -q "_gpsFreshRequest" index_v3.html
          grep -q "maximumAge:0" index_v3.html
          grep -q "gps-status" index_v3.html

          echo "Correction GPS terrain valide"

      - name: Enregistrer dans main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index_v3.html

          if git diff --cached --quiet; then
            echo "Aucune modification detectee"
          else
            git commit -m "GPS terrain v3.77"
            git push origin HEAD:main
          fi
