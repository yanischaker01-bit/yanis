<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carte LGV SEA</title>
<link rel="manifest" href="manifest.json">
<link rel="preload" as="fetch" href="data/rail.geojson" crossorigin="anonymous">
<link rel="preload" as="fetch" href="data/pk.geojson" crossorigin="anonymous">
<link rel="preload" as="fetch" href="data/oa.geojson" crossorigin="anonymous">
<meta name="theme-color" content="#cc0000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LGV SEA">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Arial,sans-serif;background:#1a1a2e;overscroll-behavior:none}
button,a,[onclick]{touch-action:manipulation}
#map{position:absolute;top:0;bottom:0;left:0;right:0;z-index:1}
#layers-panel{will-change:transform}
#tbl-panel{will-change:height}
#loader{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:white;padding:24px 36px;border-radius:12px;
  box-shadow:0 4px 24px rgba(0,0,0,.35);z-index:9999;text-align:center;
  font-size:14px;color:#1a1a2e;font-weight:500}
#loader::after{content:"";display:block;margin:14px auto 0;width:34px;height:34px;
  border:4px solid #eee;border-top:4px solid #cc0000;border-radius:50%;
  animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Popup */
.popup-card{max-width:300px;font-size:12.5px}
.popup-card h3{font-size:13.5px;color:#1a1a2e;margin-bottom:8px;
  border-bottom:2px solid #cc0000;padding-bottom:5px;line-height:1.3}
.popup-card table{width:100%;border-collapse:collapse}
.popup-card td{padding:3px 5px;vertical-align:top;border-bottom:1px solid #f0f0f0}
.popup-card td:first-child{font-weight:600;color:#666;white-space:nowrap;
  width:85px;font-size:11.5px}
.popup-card img{width:100%;border-radius:6px;margin-top:10px;cursor:zoom-in;
  transition:transform .2s;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.popup-card img:hover{transform:scale(1.03)}
.btn-sp{display:block;margin-top:8px;text-align:center;background:#0078d4;
  color:white !important;padding:5px 10px;border-radius:5px;text-decoration:none;
  font-size:11.5px;font-weight:600}
.btn-sp:hover{background:#005ea2}
.btn-pj{display:inline-block;margin-top:8px;background:#e8f5e9;color:#2e7d32;
  border:1px solid #a5d6a7;padding:4px 9px;border-radius:4px;cursor:pointer;
  font-size:11.5px;font-weight:600}
.btn-pj:hover{background:#c8e6c9}
/* Légende */
.lgv-legend{background:white;padding:10px 14px;border-radius:8px;
  box-shadow:0 2px 10px rgba(0,0,0,.2);font-size:11px;min-width:160px;max-height:60vh;overflow-y:auto}
.lgv-legend h4{font-size:11.5px;font-weight:700;margin-bottom:8px;
  color:#1a1a2e;border-bottom:1px solid #eee;padding-bottom:4px}
.li{display:flex;align-items:center;gap:7px;margin:3px 0;line-height:1.3}
.lc{width:13px;height:13px;border-radius:3px;flex-shrink:0;border:1px solid rgba(0,0,0,.15)}
.ll{width:20px;height:3px;flex-shrink:0;border-radius:2px}
/* ── Étiquettes permanentes (affichées selon zoom) ── */
.tip-pk{background:rgba(255,255,255,.92);border:1px solid #555;color:#222;
  font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px;white-space:nowrap;
  box-shadow:0 1px 4px rgba(0,0,0,.25);pointer-events:none}
.tip-oa{background:rgba(0,188,212,.9);color:white;border:none;
  font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:3px;white-space:nowrap;
  box-shadow:0 1px 4px rgba(0,0,0,.3);pointer-events:none}
.tip-oh{background:rgba(255,140,0,.9);color:white;border:none;
  font-size:10px;font-weight:600;padding:1px 5px;border-radius:3px;white-space:nowrap;
  box-shadow:0 1px 4px rgba(0,0,0,.3);pointer-events:none}
/* Étiquette Natura 2000 */
.tip-n2{background:rgba(27,94,32,.82);color:white;border:none;
  font-size:9.5px;font-weight:600;padding:1px 5px;border-radius:3px;white-space:nowrap;
  pointer-events:none;text-align:center}
/* tip-pk/oa/n2/oh masqués par défaut, révélés par classe zoom sur #map */
.leaflet-tooltip.tip-pk,.leaflet-tooltip.tip-oa,.leaflet-tooltip.tip-n2,.leaflet-tooltip.tip-oh{display:none}
.lbl-pk50 .leaflet-tooltip.tip-pk50{display:block}
.lbl-pk10 .leaflet-tooltip.tip-pk10{display:block}
.lbl-pk1 .leaflet-tooltip.tip-pk1{display:block}
.lbl-pkh .leaflet-tooltip.tip-pkh{display:block}
.lbl-oa .leaflet-tooltip.tip-oa{display:block}
.lbl-oh .leaflet-tooltip.tip-oh{display:block}
.lbl-n2 .leaflet-tooltip.tip-n2{display:block}
/* Panneau liste des couches */
#layers-panel{position:absolute;top:60px;left:0;z-index:800;
  background:white;border-radius:0 8px 8px 0;box-shadow:2px 2px 12px rgba(0,0,0,.25);
  transition:transform .25s;transform:translateX(-100%);width:220px}
#layers-panel.open{transform:translateX(0)}
#layers-panel-header{background:#1a1a2e;color:white;padding:8px 12px;
  font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:space-between;
  border-radius:0 8px 0 0;cursor:pointer}
#layers-panel-body{padding:8px 10px;max-height:calc(100vh - 120px);overflow-y:auto}
.lp-item{display:flex;align-items:center;gap:8px;padding:4px 2px;font-size:11.5px;cursor:pointer}
.lp-item input[type=checkbox]{width:14px;height:14px;cursor:pointer;flex-shrink:0}
.lp-swatch{width:14px;height:14px;border-radius:3px;flex-shrink:0;border:1px solid rgba(0,0,0,.15)}
.lp-line{width:20px;height:3px;border-radius:2px;flex-shrink:0}
/* Bouton ouvrir panneau */
#layers-btn{position:absolute;top:60px;left:0;z-index:799;
  background:#1a1a2e;color:white;border:none;border-radius:0 6px 6px 0;
  padding:8px 10px;cursor:pointer;font-size:18px;box-shadow:2px 2px 8px rgba(0,0,0,.3)}
#layers-btn:hover{background:#2d2d4e}
/* Bouton localiser */
#locate-btn{position:absolute;top:10px;right:50px;z-index:800;
  background:white;border:none;border-radius:6px;
  width:34px;height:34px;cursor:pointer;font-size:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
#locate-btn:hover{background:#f0f7ff}
/* Barre de recherche */
#search-wrap{position:absolute;top:10px;left:50%;transform:translateX(-50%);
  z-index:1000;width:320px;max-width:90vw}
#search-input{width:100%;padding:8px 14px;border-radius:20px;border:none;
  box-shadow:0 2px 12px rgba(0,0,0,.35);font-size:13px;outline:none}
#search-res{background:white;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.25);
  margin-top:4px;max-height:220px;overflow-y:auto;display:none}
.sr-item{padding:8px 14px;cursor:pointer;font-size:12.5px;border-bottom:1px solid #f0f0f0;
  display:flex;gap:10px;align-items:center}
.sr-item:hover{background:#f5f5f5}
.sr-badge{font-size:10px;background:#e3f2fd;color:#1565c0;padding:2px 6px;
  border-radius:10px;white-space:nowrap}
/* Panneau table attributaire */
#tbl-panel{position:absolute;bottom:0;left:0;right:0;height:0;background:white;
  z-index:900;transition:height .3s;box-shadow:0 -4px 20px rgba(0,0,0,.2);display:flex;flex-direction:column}
#tbl-panel.open{height:40vh;min-height:200px}
#tbl-header{display:flex;align-items:center;gap:8px;padding:6px 12px;
  background:#1a1a2e;color:white;flex-shrink:0}
#tbl-header select,#tbl-header input{padding:4px 8px;border-radius:4px;border:none;font-size:12px}
#tbl-header input{flex:1;min-width:120px}
#tbl-close{margin-left:auto;cursor:pointer;font-size:18px;line-height:1;background:none;border:none;color:white}
#tbl-scroll{overflow:auto;flex:1}
#tbl-scroll table{width:100%;border-collapse:collapse;font-size:11.5px}
#tbl-scroll th{background:#f5f5f5;padding:5px 8px;text-align:left;
  border-bottom:2px solid #ddd;white-space:nowrap;cursor:pointer;position:sticky;top:0}
#tbl-scroll td{padding:4px 8px;border-bottom:1px solid #f0f0f0;max-width:200px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tbl-scroll tr:hover td{background:#f9fbe7}
.tbl-zoom{cursor:pointer;background:#e3f2fd;border:none;border-radius:3px;
  padding:2px 6px;font-size:11px;color:#1565c0}
/* Boutons flottants */
#fab-bar{position:absolute;bottom:max(36px,calc(env(safe-area-inset-bottom,0px) + 10px));right:10px;z-index:800;display:flex;flex-direction:column;gap:6px}
.fab{width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.3);font-size:18px;display:flex;align-items:center;justify-content:center;
  transition:transform .1s;position:relative}
.fab:hover{transform:scale(1.1)}
.fab-white{background:white}
/* Badge état hors-ligne sur le bouton cache */
#offline-btn[data-state="ready"]::after{content:"✓";position:absolute;bottom:-2px;right:-2px;
  background:#2e7d32;color:white;font-size:8px;width:12px;height:12px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-weight:700}
#offline-btn[data-state="offline"]::after{content:"✗";position:absolute;bottom:-2px;right:-2px;
  background:#c62828;color:white;font-size:8px;width:12px;height:12px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-weight:700}
/* Toast statut réseau */
#net-toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:10000;
  background:rgba(26,26,46,.9);color:white;padding:7px 18px;border-radius:20px;
  font-size:12.5px;display:none;pointer-events:none;white-space:nowrap;transition:opacity .3s}
/* Lightbox photo */
#lightbox{display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.85);z-index:99999;align-items:center;justify-content:center;cursor:zoom-out}
#lightbox.open{display:flex}
#lightbox img{max-width:90vw;max-height:90vh;border-radius:6px;box-shadow:0 8px 32px rgba(0,0,0,.6)}
/* Modal PJ */
#pj-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.5);z-index:9000;align-items:center;justify-content:center}
#pj-modal.open{display:flex}
#pj-box{background:white;border-radius:10px;padding:20px;width:380px;max-width:95vw;
  max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.3)}
#pj-box h3{font-size:14px;margin-bottom:12px;color:#1a1a2e}
.pj-item{display:flex;gap:8px;align-items:center;padding:6px 0;
  border-bottom:1px solid #f0f0f0;font-size:12.5px}
.pj-item a{color:#0078d4;text-decoration:none;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pj-del{background:#ffebee;border:none;border-radius:3px;padding:2px 7px;
  cursor:pointer;color:#c62828;font-size:11px}
.leaflet-control-layers-list label{font-size:12px}
/* Detail side panel */
#dp-backdrop{display:none;position:fixed;inset:0;z-index:899;background:transparent;cursor:pointer}
#dp-backdrop.open{display:block}
#detail-panel{position:absolute;top:0;right:0;bottom:0;width:340px;max-width:92vw;
  background:white;z-index:900;transform:translateX(100%);
  transition:transform .3s cubic-bezier(.4,0,.2,1);will-change:transform;
  box-shadow:-4px 0 20px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
#detail-panel.open{transform:translateX(0)}
#detail-header{background:#1a1a2e;color:white;padding:10px 14px;display:flex;
  align-items:center;gap:8px;flex-shrink:0}
#detail-body{flex:1;overflow-y:auto;padding:0;font-size:12.5px}
/* ── Panneau détail ArcGIS-style ─────────────────────────────── */
.dp-hero{padding:10px 14px 8px;border-top:4px solid #1a1a2e;background:#fafafa}
.dp-badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;
  border-radius:10px;margin-bottom:4px;letter-spacing:.5px;color:white}
.dp-main{font-size:13px;font-weight:700;line-height:1.25;color:#1a1a2e;word-break:break-word}
.dp-sub{font-size:11px;color:#666;margin-top:2px;line-height:1.3;word-break:break-word}
.dp-sec{padding:7px 14px;border-bottom:1px solid #f0f0f0}
.dp-sec-hd{font-size:9px;font-weight:700;color:#bbb;text-transform:uppercase;
  letter-spacing:.8px;margin-bottom:5px}
.dp-row{display:flex;padding:2px 0;line-height:1.4}
.dp-k{color:#aaa;font-size:10.5px;min-width:90px;width:90px;flex-shrink:0;padding-right:6px}
.dp-v{color:#1a1a2e;font-size:11.5px;flex:1;word-break:break-word}
.dp-photo-w{padding:8px 14px;border-bottom:1px solid #f0f0f0}
.dp-photo-w img{width:100%;border-radius:5px;cursor:zoom-in;
  box-shadow:0 2px 8px rgba(0,0,0,.18);transition:transform .2s}
.dp-photo-w img:hover{transform:scale(1.02)}
.dp-actions{padding:7px 14px;border-bottom:1px solid #f0f0f0;display:flex;flex-wrap:wrap;gap:6px}
.dp-sp{display:inline-flex;align-items:center;gap:5px;background:#e3f2fd;color:#1565c0;
  border-radius:5px;padding:5px 10px;font-size:11.5px;font-weight:600;
  text-decoration:none;border:none;cursor:pointer}
.dp-sp:hover{background:#bbdefb}
.dpj{padding:8px 14px 14px}
.dpj-hd{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.dpj-lbl{font-size:9px;font-weight:700;color:#bbb;text-transform:uppercase;
  letter-spacing:.8px;flex:1}
.dpj-cnt{background:#e8f5e9;color:#2e7d32;font-size:10px;font-weight:700;
  padding:1px 8px;border-radius:10px;min-width:18px;text-align:center}
.dpj-item{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid #f5f5f5}
.dpj-item a{color:#0078d4;text-decoration:none;flex:1;font-size:11.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dpj-item a:hover{text-decoration:underline}
.dpj-date{color:#ccc;font-size:9.5px;white-space:nowrap;flex-shrink:0}
.dpj-add{display:inline-flex;align-items:center;gap:5px;margin-top:8px;
  background:#f1f8e9;border:1px solid #c5e1a5;border-radius:5px;
  padding:5px 10px;font-size:11.5px;font-weight:600;color:#33691e;cursor:pointer}
.dpj-add:hover{background:#dcedc8}
.dpj-empty{color:#ccc;font-size:11.5px;padding:2px 0}
/* KML choice modal */
#kml-choice-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.55);z-index:9500;align-items:center;justify-content:center}
#kml-choice-modal.open{display:flex}
.kml-del{background:#ffebee;border:none;border-radius:3px;padding:2px 7px;
  cursor:pointer;color:#c62828;font-size:11px;margin-left:auto;flex-shrink:0}
/* ══ Mobile / Téléphone ══════════════════════════════════════════════ */
@media(max-width:768px){
  #detail-panel{position:fixed;width:100%;max-width:100%;top:auto;height:70vh;transform:translateY(100%);
    box-shadow:0 -4px 20px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.4,0,.2,1)}
  #detail-panel.open{transform:translateY(0)}
  #dp-backdrop.open{background:rgba(0,0,0,.25)}
  #search-wrap{left:44px;width:calc(100vw - 110px);transform:none;top:8px}
  #search-input{font-size:14px;padding:9px 12px}
  #search-res{max-height:160px}
  #layers-btn{top:10px;padding:10px 13px;font-size:22px;border-radius:0 8px 8px 0}
  #layers-panel{width:min(290px,82vw)}
  .lp-item{padding:9px 4px;font-size:13.5px}
  .lp-item input[type=checkbox]{width:18px;height:18px}
  #locate-btn{width:40px;height:40px;right:8px;top:8px;font-size:20px}
  .fab{width:50px;height:50px;font-size:22px}
  #fab-bar{bottom:max(28px,calc(env(safe-area-inset-bottom,0px) + 12px));right:8px;gap:8px}
  #tbl-panel.open{height:52vh}
  #tbl-header{flex-wrap:wrap;gap:4px;padding:6px 8px}
  #tbl-header select{font-size:11px;max-width:130px}
  #tbl-header input{font-size:11px;min-width:70px}
  .popup-card{font-size:13px}
  .leaflet-popup-content-wrapper{max-width:calc(100vw - 24px)!important}
  .leaflet-control-zoom a{width:36px!important;height:36px!important;line-height:36px!important;font-size:18px!important}
  .lgv-legend{font-size:10px;padding:7px 10px;max-height:35vh;min-width:140px}
  .lgv-legend h4{font-size:10.5px}
  #loader{padding:18px 24px;font-size:13px}
}
@media(max-width:420px){
  #search-wrap{left:40px;width:calc(100vw - 100px)}
  #tbl-header select{max-width:100px;font-size:10.5px}
}
</style>
</head>
<body>
<div id="loader">Chargement des données LGV SEA…</div>
<div id="map"></div>
<!-- Barre de recherche -->
<div id="search-wrap">
  <input id="search-input" type="text" placeholder="🔍  PK (ex: 234+500), OA, OH, Accès…" autocomplete="off"/>
  <div id="search-res"></div>
</div>
<!-- Panneau table attributaire -->
<div id="tbl-panel">
  <div id="tbl-header">
    <span style="font-weight:700;font-size:13px">📋 Table attributaire</span>
    <select id="tbl-layer-sel" onchange="fillTable()">
      <option value="oa">OA – Ouvrages d'Art</option>
      <option value="oh">OH – Ouvrages Hydrauliques</option>
      <option value="acces">Accès</option>
      <option value="pam">PAM</option>
      <option value="mc">Mesures compensatoires</option>
      <option value="old">Zones OLD</option>
      <option value="n2">Natura 2000</option>
      <option value="eco">Écopâturage</option>
      <option value="bois">Boisements</option>
    </select>
    <input id="tbl-filter" type="text" placeholder="Filtrer…" oninput="filterTable()" style="margin-left:4px"/>
    <button id="tbl-close" onclick="closeTable()">✕</button>
  </div>
  <div id="tbl-scroll"></div>
</div>
<!-- Panneau liste des couches -->
<button id="layers-btn" title="Couches" onclick="toggleLayersPanel()">☰</button>
<div id="layers-panel">
  <div id="layers-panel-header" onclick="toggleLayersPanel()">
    <span>📑 Couches</span><span>✕</span>
  </div>
  <div id="layers-panel-body"></div>
</div>
<!-- Bouton localiser -->
<button id="locate-btn" title="Me localiser" onclick="locateMe()">📍</button>
<!-- Badge version + statut réseau -->
<div id="ver-badge" title="Version / statut réseau" style="position:absolute;bottom:max(8px,calc(env(safe-area-inset-bottom,0px) + 4px));right:8px;z-index:800;
  background:rgba(26,26,46,.75);color:rgba(255,255,255,.55);font-size:9.5px;
  padding:2px 6px;border-radius:8px;pointer-events:none;letter-spacing:.3px"></div>
<!-- Toast réseau -->
<div id="net-toast"></div>
<!-- Boutons flottants -->
<div id="fab-bar">
  <button id="install-btn" class="fab fab-white" title="Installer l'application sur cet appareil" onclick="installApp()">📲</button>
  <button id="offline-btn" class="fab fab-white" title="Mettre en cache pour utilisation hors-ligne" onclick="warmOfflineCache()">📶</button>
  <button class="fab fab-white" title="Vue d'ensemble LGV SEA" onclick="resetView()">🏠</button>
  <button class="fab fab-white" title="Table attributaire" onclick="toggleTable()">📋</button>
  <button class="fab fab-white" title="Importer KML/KMZ" onclick="document.getElementById('kml-input').click()">📎</button>
  <input type="file" id="kml-input" accept=".kml,.kmz" style="display:none" onchange="importKML(this)"/>
</div>
<!-- Bandeau statut chargement Phase 2 -->
<div id="load-status" style="display:none;position:absolute;bottom:36px;left:50%;transform:translateX(-50%);
  z-index:802;background:rgba(26,26,46,.9);color:white;padding:5px 16px;border-radius:16px;
  font-size:11.5px;white-space:nowrap;pointer-events:none;letter-spacing:.2px"></div>
<!-- Backdrop fermeture panneau détail -->
<div id="dp-backdrop" onclick="closeDetail()"></div>
<!-- Detail side panel -->
<div id="detail-panel">
  <div id="detail-header">
    <span id="detail-title" style="flex:1;font-size:12.5px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>

function _featBbox(f){
  if(f._bbox)return f._bbox;
  var crds=f.geometry&&f.geometry.coordinates;
  if(!crds)return(f._bbox=[0,0,0,0]);
  var mnx=Infinity,mny=Infinity,mxx=-Infinity,mxy=-Infinity;
  (function sc(a){typeof a[0]==="number"?(a[0]<mnx&&(mnx=a[0]),a[1]<mny&&(mny=a[1]),a[0]>mxx&&(mxx=a[0]),a[1]>mxy&&(mxy=a[1])):a.forEach(sc);})(crds);
  return(f._bbox=[mnx,mny,mxx,mxy]);
}
function _inBounds(f,b){var bb=_featBbox(f);return bb[2]>=b.getWest()&&bb[0]<=b.getEast()&&bb[3]>=b.getSouth()&&bb[1]<=b.getNorth();}

// ─── CHARGEMENT CHUNKED (évite le gel de l'UI sur les grosses couches) ───
function addChunked(addFn,items,batchSize,onDone){
  var i=0;batchSize=batchSize||80;
  function step(){
    var end=Math.min(i+batchSize,items.length);
    while(i<end)addFn(items[i++]);
    if(i<items.length)requestAnimationFrame(step);
    else if(onDone)onDone();
  }
  if(items.length)requestAnimationFrame(step);else if(onDone)onDone();
}
// ─── addLayers() batch API pour MarkerCluster (bien plus rapide que addLayer() individuel) ───
function addMarkersChunked(feats,opts,cluster,batchSize,onDone){
  var i=0;batchSize=batchSize||50;
  function step(){
    var end=Math.min(i+batchSize,feats.length),batch=[];
    while(i<end){L.geoJSON(feats[i],opts).eachLayer(function(l){batch.push(l);});i++;}
    if(batch.length)cluster.addLayers(batch);
    if(i<feats.length)requestAnimationFrame(step);
    else if(onDone)onDone();
  }
  if(feats.length)requestAnimationFrame(step);else if(onDone)onDone();
}

function loadJSON(name){

}
function emptyFC(){return {type:"FeatureCollection",features:[]};}
function loadJSONSafe(name){
  return loadJSON(name).catch(function(err){
    console.warn("Couche "+name+" indisponible:",err);
    return emptyFC();
  });
}
// Détection automatique encodage : UTF-8 (fatal) → fallback Windows-1252
function loadJSONAutoEncoding(name){
  return fetch("data/"+name+".geojson")
    .then(function(r){if(!r.ok)throw new Error(name+" : HTTP "+r.status);return r.arrayBuffer();})
    .then(function(buf){
      try{return JSON.parse(new TextDecoder("utf-8",{fatal:true}).decode(buf));}
      catch(e){return JSON.parse(new TextDecoder("windows-1252").decode(buf));}
    })
    .catch(function(err){console.warn("Couche "+name+" (enc auto) indisponible:",err);return emptyFC();});
}

    if(_uvPending)return;

      _uvPending=false;
      var z=map.getZoom();

      if(!_pkOff){
        if(z>=7)layerOn(pk50Layer); else layerOff(pk50Layer);
        if(z>=10)layerOn(pk10Layer); else layerOff(pk10Layer);
        if(z>=13)layerOn(pk1Layer);  else layerOff(pk1Layer);
      } else {
        [pk50Layer,pk10Layer,pk1Layer].forEach(layerOff);
      }
      if(!_pkHectoOff&&z>=17){
        if(!_pkHInited){
          if(_pkHData){
            _pkHInited=true;

              pane:"pane-pk",
              pointToLayer:function(f,ll){return L.circleMarker(ll,mkPkStyle(2.5,"#666","#eee",1));},
              onEachFeature:function(f,l){

              }
            }).addTo(pkHectoLayer);
            layerOn(pkHectoLayer);
          } else {

              _pkHData=data;addPKHectoToIndex(data);

            });

      if(!_oldOff&&z>=9)   layerOn(oldLayer);     else layerOff(oldLayer);

      if(!_oaOff&&z>=11)   layerOn(oaCluster);    else layerOff(oaCluster);
      if(!_ecoOff&&z>=11)  layerOn(ecoLayer);     else layerOff(ecoLayer);
      if(!_boisOff&&z>=12) layerOn(boisLayer);    else layerOff(boisLayer);
      if(!_accOff&&z>=12)  layerOn(accLayer);     else layerOff(accLayer);
      if(!_oaPolyOff&&z>=13) layerOn(oaPolyLayer); else layerOff(oaPolyLayer);
      if(!_pamOff&&z>=13)  layerOn(pamCluster);   else layerOff(pamCluster);

    });
    // ── Tout cocher / décocher ──
    window.setAllLayers=function(on){
      defs.forEach(function(d){
        if(d.offFn){d.offFn(!on);}
        else{
          if(on&&!map.hasLayer(d.layer))d.layer.addTo(map);
          else if(!on&&map.hasLayer(d.layer))map.removeLayer(d.layer);
          if(d.layer===pkLayer)_pkOff=!on;
          if(d.layer===pkHectoLayer)_pkHectoOff=!on;
        }
      });
      updateVisibility();
      _saveLayerStates();
      body.querySelectorAll(".lp-item input").forEach(function(cb){cb.checked=on;});
    };
  }
  initLayersPanel();
  // Mise à jour badge panel couches après Phase 2
  window._updateLpCount=function(key,n){
    var el=document.getElementById("lp-"+key);
    if(!el)return;
    el.textContent=n>0?" ("+n+")":"";
    el.style.color=n>0?"#888":"#ccc";
  };
  function updateLoadStatus(){
    var sl=document.getElementById("load-status");
    if(!sl)return;
    var any=_loading.oa||_loading.oh||_loading.pam||_loading.bois;
    if(!any){sl.style.display="none";return;}
    var parts=[];
    parts.push(_loading.oa?"🏗 OA ⏳":"🏗 "+layerData.oa.length+" OA");
    parts.push(_loading.oh?"💧 OH ⏳":"💧 "+layerData.oh.length+" OH");
    parts.push(_loading.pam?"🌱 PAM ⏳":"🌱 "+layerData.pam.length+" PAM");
    parts.push(_loading.bois?"🌳 Boisements ⏳":"🌳 "+layerData.bois.length+" boisements");
    sl.textContent=parts.join("   ");
    sl.style.display="block";
  }
  window._updateLoadStatus=updateLoadStatus;
  updateLoadStatus();
  refreshTableIfOpen();

  // ─── Phase 2 : couches lourdes ──────────────────────────────────────────
  // Garde les propriétés mais retire _ph_b64 de layerData (trop lourd en mémoire)
  function stripB64(props){var p=Object.assign({},props);delete p._ph_b64;return p;}

  _oaProm.then(function(oa){
    var oaFeats=oa.features||[];
    var oaOpts={pane:"pane-oa",
      pointToLayer:function(f,ll){return L.marker(ll,{icon:mkIcon("🏗",22),pane:"pane-oa"})},
      onEachFeature:function(f,l){
        var code=c(f.properties.CODE_OBJET),lib=c(f.properties.LIBELLE_LO);
        var lbl=(code&&lib)?code+" – "+lib:(code||lib);
        l.bindTooltip(lbl,{permanent:true,direction:"top",className:"tip-oa",offset:[0,-13]});
        l.on("click",function(e){L.DomEvent.stopPropagation(e);openDetailOA(l.feature.properties);});
      }};
    addMarkersChunked(oaFeats,oaOpts,oaCluster,50,function(){
      var cnt=oaFeats.length;
      var el=document.getElementById("cnt-oa");if(el)el.textContent=cnt;
      _updateLpCount("oa",cnt);
      layerData.oa=oaFeats.map(function(f){return{props:stripB64(f.properties),geom:f.geometry};});
      _loading.oa=false;
      if(window._updateLoadStatus)_updateLoadStatus();
      buildSearchIndex();refreshTableIfOpen();
    });
  }).catch(function(e){
    var el=document.getElementById("cnt-oa");if(el)el.textContent="0";
    _updateLpCount("oa",0);_loading.oa=false;
    if(window._updateLoadStatus)_updateLoadStatus();
    refreshTableIfOpen();console.error("OA erreur:",e);
  });

  _ohProm.then(function(oh){
    var ohFeats=oh.features||[];
    _ohFeatsAll=ohFeats;
    _ohFeatsAll.forEach(_featBbox);
    var z=map.getZoom();
    var initFeats=z>=16?_ohFeatsAll.filter(function(f){return _inBounds(f,map.getBounds().pad(.6));})
                       :_ohFeatsAll;
    addChunked(function(f){ohLayer.addData(f);},initFeats,100,function(){
      var cnt=ohFeats.length;
      _ohVCReady=true;
      var el=document.getElementById("cnt-oh");if(el)el.textContent=cnt;
      _updateLpCount("oh",cnt);
      layerData.oh=ohFeats.map(function(f){return{props:stripB64(f.properties),geom:f.geometry};});
      _loading.oh=false;
      if(window._updateLoadStatus)_updateLoadStatus();
      buildSearchIndex();refreshTableIfOpen();
    });
  }).catch(function(e){
    var el=document.getElementById("cnt-oh");if(el)el.textContent="0";
    _updateLpCount("oh",0);_loading.oh=false;
    if(window._updateLoadStatus)_updateLoadStatus();
    refreshTableIfOpen();console.error("OH erreur:",e);
  });

  _pamProm.then(function(pam){
    var pamFeats=pam.features||[];
    var pamOpts={pane:"pane-oa",
      pointToLayer:function(f,ll){return L.marker(ll,{icon:mkIcon("🌱",20),pane:"pane-oa"})},
      onEachFeature:function(f,l){
        var p=f.properties;
        l.bindTooltip(c(p.libelle||p.axe||"PAM"),{sticky:true});
        l.on("click",function(e){L.DomEvent.stopPropagation(e);openDetailPAM(l.feature.properties);});
      }};
    addMarkersChunked(pamFeats,pamOpts,pamCluster,50,function(){
      var cnt=pamFeats.length;
      var el=document.getElementById("cnt-pam");if(el)el.textContent=cnt;
      _updateLpCount("pam",cnt);
      layerData.pam=pamFeats.map(function(f){return{props:stripB64(f.properties),geom:f.geometry};});
      _loading.pam=false;
      if(window._updateLoadStatus)_updateLoadStatus();
      buildSearchIndex();refreshTableIfOpen();
    });
  }).catch(function(e){
    var el=document.getElementById("cnt-pam");if(el)el.textContent="0";
    _updateLpCount("pam",0);
    _loading.pam=false;
    if(window._updateLoadStatus)_updateLoadStatus();
    refreshTableIfOpen();
    console.error("PAM erreur:",e);
  });

  // ── Boisements (Phase 2 – 2,3 Mo, canvas + viewport culling) ────────────
  _boisProm.then(function(boisData){
    _boisFeatsAll=boisData.features||[];
    _boisFeatsAll.forEach(_featBbox); // pré-calcul bbox pour _inBounds rapide
    var z=map.getZoom();
    // Chargement initial filtré si déjà zoomé (évite 2 Mo d'un coup)
    var initFeats=z>=12?_boisFeatsAll.filter(function(f){return _inBounds(f,map.getBounds().pad(.5));}):_boisFeatsAll;
    addChunked(function(f){boisLayer.addData(f);},initFeats,150,function(){
      var bcnt=_boisFeatsAll.length;
      _boisVCReady=true;
      layerData.bois=_boisFeatsAll.map(function(f){return{props:f.properties,geom:f.geometry};});
      _loading.bois=false;
      if(window._updateLpCount)_updateLpCount("bois",bcnt);
      if(window._updateLoadStatus)_updateLoadStatus();
      buildSearchIndex();refreshTableIfOpen();
    });
  }).catch(function(e){
    _loading.bois=false;
    if(window._updateLpCount)_updateLpCount("bois",0);
    if(window._updateLoadStatus)_updateLoadStatus();
    console.error("Bois erreur:",e);
  });

  // ── Restaurer KML depuis localStorage ────────────────────────────────────
  restoreKMLLayers(layerCtrl);

}).catch(function(err){showError(err&&err.message||"Erreur de chargement");console.error(err);});

} // end else (not file://)

var _focusLayer=null;
function clearFocusGeom(){
  if(_focusLayer){map.removeLayer(_focusLayer);_focusLayer=null;}
}
function focusGeom(geom,opts){
  if(!geom)return;
  clearFocusGeom();
  opts=opts||{};
  try{
    _focusLayer=L.geoJSON({type:"Feature",properties:{},geometry:geom},{
      pane:"pane-focus",
      pointToLayer:function(f,ll){
        return L.circleMarker(ll,{
          radius:10,color:"#ff1744",weight:3,
          fillColor:"#fff176",fillOpacity:.95,pane:"pane-focus"
        });
      },
      style:{color:"#ff1744",weight:6,opacity:.95,fillColor:"#fff176",fillOpacity:.18,dashArray:"8 4"}
    }).addTo(map);
    if(geom.type==="Point"){
      var coords=geom.coordinates;
      map.setView([coords[1],coords[0]], opts.zoom||17, {animate:true});
    } else {
      var bounds=_focusLayer.getBounds();
      if(bounds && bounds.isValid()) map.fitBounds(bounds.pad(.15), {animate:true,maxZoom:opts.maxZoom||17});
    }
    setTimeout(clearFocusGeom, opts.ttl||8000);
  }catch(e){}
}

var searchIndex=[];
function buildSearchIndex(){
  searchIndex=searchIndex.filter(function(x){return x.type==="PK";});
  // PK (depuis les features pk.geojson déjà chargées côté JS)
  // OA
  layerData.oa.forEach(function(f){
    var p=f.props;
    searchIndex.push({type:"OA",label:c(p.CODE_OBJET)+" – "+c(p.LIBELLE_LO),
      sub:c(p._pk_fmt),geom:f.geom});
  });
  // OH
  layerData.oh.forEach(function(f){
    var p=f.props;
    searchIndex.push({type:"OH",label:c(p.code_objet)+" – "+c(p.libelle_ob),
      sub:c(p._pk_fmt),geom:f.geom});
  });
  // Accès
  layerData.acces.forEach(function(f){
    var p=f.props;
    searchIndex.push({type:"Accès",label:c(p.NOM_ACCES||p.Name||""),
      sub:c(p.AXE)+" PK "+c(p.PK),geom:f.geom});
  });
  // PAM
  layerData.pam.forEach(function(f){
    var p=f.props;
    searchIndex.push({type:"PAM",label:c(p.libelle||"PAM"),
      sub:[c(p.axe),c(p.pk_ef||p.pk_gc)].filter(Boolean).join(" • "),geom:f.geom});
  });
  // Mesures compensatoires
  layerData.mc.forEach(function(f){
    var p=f.props;
    searchIndex.push({type:"MC",label:c(p.projet||"Mesure compensatoire"),
      sub:[c(p.theme),c(p.type),c(p.classe)].filter(Boolean).join(" • "),geom:f.geom});
  });
  // OLD
  layerData.old.forEach(function(f){
    var p=f.props;
    searchIndex.push({type:"OLD",label:c(p.CODE||p.libelle||"Zone OLD"),
      sub:c(p.libelle),geom:f.geom});
  });
  // Natura 2000
  (layerData.n2||[]).forEach(function(f){
    var p=f.props;
    searchIndex.push({type:"N2000",label:c(p.sitename||p.cd_sig),
      sub:c(p.type_complet),geom:f.geom});
  });
  // Écopâturage
  layerData.eco.forEach(function(f){
    var p=f.props;
    searchIndex.push({type:"Eco",label:c(p.Appellation||p.Name||"Écopâturage"),
      sub:c(p.Occupation),geom:f.geom});
  });
  // Boisements
  layerData.bois.forEach(function(f){
    var p=f.props;
    searchIndex.push({type:"Bois",label:c(p.TYPE_OBJET||"Boisement"),
      sub:[c(p.CODE_AXE),c(p.PK_DEB_STR||p.PK_DEB),c(p.PK_FIN_STR||p.PK_FIN)].filter(Boolean).join(" • "),geom:f.geom});
  });
}
// Ajouter PK 1km dans l'index une fois chargés
var _pkLoaded=false;
function addPKtoIndex(fc){
  if(_pkLoaded)return;_pkLoaded=true;
  (fc.features||[]).forEach(function(f){
    searchIndex.push({type:"PK",label:c(f.properties._pk_label||f.properties.Name),
      sub:c(f.properties._voie||""),geom:f.geometry});
  });
}
// Ajouter PK 100m dans l'index (pour recherche "235+1" → PK 235+100)
var _pkHLoaded=false;
function addPKHectoToIndex(fc){
  if(_pkHLoaded||!fc)return;_pkHLoaded=true;
  (fc.features||[]).forEach(function(f){
    searchIndex.push({type:"PK",label:c(f.properties._pk_label||f.properties.Name),
      sub:c(f.properties._voie||""),geom:f.geometry});
  });
}

var _searchTimeout;
document.getElementById("search-input").addEventListener("input",function(){
  clearTimeout(_searchTimeout);
  var q=this.value.trim();
  var res=document.getElementById("search-res");
  if(q.length<2){res.style.display="none";return;}
  _searchTimeout=setTimeout(function(){
    var ql=q.toLowerCase();
    var isPkQuery=/\d{1,3}\s*\+\s*\d{1,3}/.test(q.trim())||/^pk\s*\d/i.test(q.trim());
    var qlNorm=ql.replace(/\s*\+\s*/g,"+");
    var hits=searchIndex.filter(function(x){
      var ln=x.label.toLowerCase().replace(/\s*\+\s*/g,"+");
      var sn=x.sub.toLowerCase().replace(/\s*\+\s*/g,"+");
      return ln.includes(qlNorm)||sn.includes(qlNorm);
    });
    if(isPkQuery){hits.sort(function(a,b){return(a.type==="PK"?0:1)-(b.type==="PK"?0:1);});}
    hits=hits.slice(0,12);
    if(!hits.length){res.style.display="none";return;}
    res.innerHTML=hits.map(function(h,i){
      return"<div class=\"sr-item\" data-idx=\""+i+"\" onclick=\"goToResult("+i+", this)\">"+
        "<span class=\"sr-badge\">"+h.type+"</span>"+
        "<span><b>"+h.label+"</b>"+(h.sub?"<br><small style=\"color:#888\">"+h.sub+"</small>":"")+"</span></div>";
    }).join("");
    res._hits=hits;
    res.style.display="block";
  },180);
});
document.getElementById("search-input").addEventListener("keydown",function(e){
  if(e.key==="Escape"){document.getElementById("search-res").style.display="none";}
});
document.addEventListener("click",function(e){
  if(!e.target.closest("#search-wrap"))document.getElementById("search-res").style.display="none";
});
function goToResult(idx,el){
  var hits=document.getElementById("search-res")._hits||[];
  var h=hits[idx];if(!h||!h.geom)return;
  focusGeom(h.geom,{zoom:17,maxZoom:17});
  document.getElementById("search-res").style.display="none";
  document.getElementById("search-input").value=h.label;
}

// TABLE ATTRIBUTAIRE
// ═══════════════════════════════════════════════════════════════
var _tblOpen=false;
var _tblCurrentLayer="oa";
var _tblSortCol=null,_tblSortAsc=true;
function toggleTable(){
  _tblOpen=!_tblOpen;
  document.getElementById("tbl-panel").classList.toggle("open",_tblOpen);
  if(_tblOpen)fillTable();
}
function refreshTableIfOpen(){
  if(_tblOpen)fillTable();
}
function closeTable(){_tblOpen=false;document.getElementById("tbl-panel").classList.remove("open");}
function fillTable(){
  _tblCurrentLayer=document.getElementById("tbl-layer-sel").value;
  var data=layerData[_tblCurrentLayer]||[];
  var filter=(document.getElementById("tbl-filter").value||"").toLowerCase();
  if(filter)data=data.filter(function(f){
    return JSON.stringify(f.props).toLowerCase().includes(filter);
  });
  if(!data.length){
    var isLoading=typeof _loading!=="undefined"&&_loading[_tblCurrentLayer];
    document.getElementById("tbl-scroll").innerHTML=isLoading
      ?"<p style=\"padding:12px;color:#888\">⏳ Chargement en cours…</p>"
      :"<p style=\"padding:12px;color:#aaa\">Aucune donnée pour cette couche.</p>";
    return;
  }
  // Colonnes
  var skip=["_ph_b64","_ph_path","_ph_url"];
  var cols=Object.keys(data[0].props).filter(function(k){return!skip.includes(k);}).slice(0,12);
  var html="<table><thead><tr><th>🔍</th>";
  cols.forEach(function(c){html+="<th onclick=\"sortTable('"+c+"')\" title=\"Trier\">"+c+(c===_tblSortCol?(_tblSortAsc?" ↑":" ↓"):"")+"</th>";});
  html+="</tr></thead><tbody>";
  if(_tblSortCol){
    data=data.slice().sort(function(a,b){
      var va=c(a.props[_tblSortCol]),vb=c(b.props[_tblSortCol]);
      return _tblSortAsc?va.localeCompare(vb,undefined,{numeric:true}):vb.localeCompare(va,undefined,{numeric:true});
    });
  }
  var MAX_ROWS=300;
  var shown=data.slice(0,MAX_ROWS);
  shown.forEach(function(f,i){
    html+="<tr><td><button class=\"tbl-zoom\" onclick=\"zoomToFeature("+i+")\" title=\"Zoom\">🔍</button></td>";
    cols.forEach(function(k){html+="<td title=\""+esc(c(f.props[k]))+"\">"+esc(c(f.props[k]))+"</td>";});
    html+="</tr>";
  });
  if(data.length>MAX_ROWS)html+="<tr><td colspan=\""+(cols.length+1)+"\" style=\"padding:8px;color:#888;text-align:center;font-size:11px\">"+
    "… "+(data.length-MAX_ROWS)+" lignes supplémentaires — affinez le filtre pour voir plus</td></tr>";
  html+="</tbody></table>";
  document.getElementById("tbl-scroll").innerHTML=html;
  document.getElementById("tbl-scroll")._data=data;
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function sortTable(col){
  if(_tblSortCol===col)_tblSortAsc=!_tblSortAsc;else{_tblSortCol=col;_tblSortAsc=true;}
  fillTable();
}
function filterTable(){fillTable();}
function zoomToFeature(idx){
  var data=(document.getElementById("tbl-scroll")._data)||[];
  var f=data[idx];if(!f||!f.geom)return;
  focusGeom(f.geom,{zoom:17,maxZoom:17});
}

var _pjCode="";
function openPJ(code,label){
  _pjCode=code;
  document.getElementById("pj-title").textContent="📎 "+label;
  renderPJList();
  document.getElementById("pj-modal").classList.add("open");
}
function closePJ(){document.getElementById("pj-modal").classList.remove("open");}
function getPJList(code){
  try{return JSON.parse(localStorage.getItem("pj_"+code)||"[]");}catch(e){return[];}
}
function savePJList(code,list){
  try{localStorage.setItem("pj_"+code,JSON.stringify(list));}catch(e){alert("Stockage plein");}
}
function renderPJList(){
  var list=getPJList(_pjCode);
  var el=document.getElementById("pj-list");
  if(!list.length){el.innerHTML="<p style=\"color:#888;font-size:12px\">Aucune pièce jointe.</p>";return;}
  el.innerHTML=list.map(function(p,i){
    return"<div class=\"pj-item\"><a href=\""+p.data+"\" download=\""+p.name+"\">📄 "+p.name+"</a>"+
      "<button class=\"pj-del\" onclick=\"deletePJ("+i+")\">✕</button></div>";
  }).join("");
}
function addPJ(input){
  var files=Array.from(input.files);
  var list=getPJList(_pjCode);
  var toRead=files.length;
  files.forEach(function(file){
    var reader=new FileReader();
    reader.onload=function(e){
      list.push({name:file.name,data:e.target.result,type:file.type,date:new Date().toISOString()});
      toRead--;if(!toRead){savePJList(_pjCode,list);renderPJList();}
    };
    reader.readAsDataURL(file);
  });
  input.value="";
}
function deletePJ(idx){
  var list=getPJList(_pjCode);
  list.splice(idx,1);
  savePJList(_pjCode,list);
  renderPJList();
}

// INJECTION KML / KMZ
// ═══════════════════════════════════════════════════════════════
var _kmlLayers={};
var _kmlPending=null;

function importKML(input){
  var file=input.files[0];if(!file)return;
  _kmlPending={file:file};
  input.value="";
  document.getElementById("kml-choice-fname").textContent=file.name;
  document.getElementById("kml-choice-modal").classList.add("open");
}
function cancelKML(){
  document.getElementById("kml-choice-modal").classList.remove("open");
  _kmlPending=null;
}
function confirmKML(store){
  document.getElementById("kml-choice-modal").classList.remove("open");
  if(!_kmlPending)return;
  var file=_kmlPending.file;_kmlPending=null;
  function addKMLLayer(geojson,fname){
    var lname="📎 "+fname;
    var lyr=L.geoJSON(geojson,{
      pane:"pane-kml",
      style:{color:"#f44336",weight:2,fillOpacity:.3},
      pointToLayer:function(f,ll){return L.marker(ll,{icon:mkIcon("📍",20),pane:"pane-kml"})},
      onEachFeature:function(f,l){
        var p=f.properties;
        l.bindTooltip(c(p.name||""),{sticky:true});
        l.bindPopup("<div class=\"popup-card\"><h3>"+c(p.name||"KML")+"</h3>"+
          (p.description?"<p style=\"font-size:12px\">"+esc(p.description)+"</p>":"")+"</div>",{maxWidth:300});
      }
    }).addTo(map);
    try{map.fitBounds(lyr.getBounds().pad(.05));}catch(e){}
    _kmlLayers[lname]=lyr;
    if(layerCtrl)layerCtrl.addOverlay(lyr,lname);
    if(store){
      try{
        var stored=JSON.parse(localStorage.getItem("kml_layers")||"[]");
        stored.push({name:lname,geojson:JSON.stringify(geojson)});
        localStorage.setItem("kml_layers",JSON.stringify(stored));
      }catch(e){}
    }
    refreshKMLSection();
  }
  function processKML(kmlStr,fname){
    var geojson;
    try{
      var parser=new DOMParser();
      var doc=parser.parseFromString(kmlStr,"text/xml");
      var conv=window.toGeoJSON||window.togeojson;
      if(conv&&conv.kml){geojson=conv.kml(doc);}
      else{alert("Bibliothèque toGeoJSON non disponible.");return;}
    }catch(e){alert("Erreur lecture KML : "+e.message);return;}
    addKMLLayer(geojson,fname);
  }
  if(file.name.toLowerCase().endsWith(".kmz")){
    var rKmz=new FileReader();
    rKmz.onload=function(ev){
      if(typeof JSZip==="undefined"){alert("JSZip non chargé.");return;}
      JSZip.loadAsync(ev.target.result).then(function(zip){
        var kmlFile=null;
        zip.forEach(function(rpath,zf){if(!kmlFile&&rpath.toLowerCase().endsWith(".kml"))kmlFile=zf;});
        if(!kmlFile){alert("Aucun fichier .kml dans ce KMZ.");return;}
        kmlFile.async("string").then(function(kmlStr){processKML(kmlStr,file.name);});
      }).catch(function(e){alert("Erreur KMZ : "+e.message);});
    };
    rKmz.readAsArrayBuffer(file);
  } else {
    var reader=new FileReader();
    reader.onload=function(ev){processKML(ev.target.result,file.name);};
    reader.readAsText(file);
  }
}
function removeKMLLayer(name){
  var lyr=_kmlLayers[name];if(!lyr)return;
  map.removeLayer(lyr);
  if(layerCtrl)layerCtrl.removeLayer(lyr);
  delete _kmlLayers[name];
  try{
    var stored=JSON.parse(localStorage.getItem("kml_layers")||"[]");
    stored=stored.filter(function(s){return s.name!==name;});
    localStorage.setItem("kml_layers",JSON.stringify(stored));
  }catch(e){}
  refreshKMLSection();
}
function clearAllKML(){
  Object.keys(_kmlLayers).slice().forEach(removeKMLLayer);
}
function refreshKMLSection(){
  var section=document.getElementById("kml-layers-section");
  if(!section)return;
  var names=Object.keys(_kmlLayers);
  if(!names.length){section.innerHTML="";return;}
  var html="<div style=\"font-size:10px;font-weight:700;color:#888;margin:10px 0 4px;border-top:1px solid #eee;padding-top:8px;display:flex;align-items:center\">"+
    "KML IMPORTÉS"+
    "<button onclick=\"clearAllKML()\" style=\"margin-left:auto;background:#ffebee;border:1px solid #ef9a9a;border-radius:3px;padding:2px 7px;cursor:pointer;color:#c62828;font-size:10px;font-weight:700\">🗑 Tout</button>"+
    "</div>";
  section.innerHTML=html;
  names.forEach(function(name){
    var div=document.createElement("div");
    div.className="lp-item";
    div.innerHTML="<span style=\"font-size:12px;flex-shrink:0\">📎</span>"+
      "<span style=\"flex:1;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">"+
      esc(name.replace(/^📎\s*/,""))+"</span>";
    var btn=document.createElement("button");
    btn.className="kml-del";btn.textContent="✕";btn.title="Supprimer";
    (function(n){btn.addEventListener("click",function(){removeKMLLayer(n);});})(name);
    div.appendChild(btn);
    section.appendChild(div);
  });
}
function restoreKMLLayers(ctrl){
  try{
    var stored=JSON.parse(localStorage.getItem("kml_layers")||"[]");
    stored.forEach(function(s){
      try{
        var geojson=JSON.parse(s.geojson);
        var lyr=L.geoJSON(geojson,{
          pane:"pane-kml",
          style:{color:"#f44336",weight:2,fillOpacity:.3},
          pointToLayer:function(f,ll){return L.marker(ll,{icon:mkIcon("📍",20),pane:"pane-kml"})},
          onEachFeature:function(f,l){
            var p=f.properties;
            l.bindTooltip(c(p.name||""),{sticky:true});
            l.bindPopup("<div class=\"popup-card\"><h3>"+c(p.name||"KML")+"</h3>"+(p.description?"<p>"+esc(p.description)+"</p>":"")+"</div>");
          }
        }).addTo(map);
        _kmlLayers[s.name]=lyr;
        if(ctrl)ctrl.addOverlay(lyr,s.name);
      }catch(e){}
    });
    refreshKMLSection();
  }catch(e){}
}

// PANNEAU DÉTAILS – style ArcGIS
// ═══════════════════════════════════════════════════════════════
function openDetail(title,bodyHtml){
  document.getElementById("detail-title").innerHTML=title;
  document.getElementById("detail-body").innerHTML=bodyHtml;
  document.getElementById("detail-panel").classList.add("open");
  document.getElementById("dp-backdrop").classList.add("open");
}
function closeDetail(){
  document.getElementById("detail-panel").classList.remove("open");
  document.getElementById("dp-backdrop").classList.remove("open");
}

// ── Briques HTML du panneau ─────────────────────────────────────────────────
function dpHero(badge,title,sub,color){
  return'<div class="dp-hero" style="border-top-color:'+color+'">'+
    '<div class="dp-badge" style="background:'+color+'">'+badge+'</div>'+
    '<div class="dp-main">'+esc(title)+'</div>'+
    (sub?'<div class="dp-sub">'+esc(sub)+'</div>':'')+
    '</div>';
}
function dpSec(hd,pairs){
  var rows=(pairs||[]).filter(function(r){return c(r[1]);}).map(function(r){
    return'<div class="dp-row"><span class="dp-k">'+r[0]+'</span><span class="dp-v">'+esc(c(r[1]))+'</span></div>';
  }).join('');
  return rows?'<div class="dp-sec"><div class="dp-sec-hd">'+hd+'</div>'+rows+'</div>':'';
}
function dpAllFields(props){
  var skip=["_ph_b64","_ph_path","_ph_url","_sp_url"];
  var rows=Object.keys(props).filter(function(k){return skip.indexOf(k)<0&&c(props[k]);}).map(function(k){
    return'<div class="dp-row"><span class="dp-k">'+esc(k)+'</span><span class="dp-v">'+esc(c(props[k]))+'</span></div>';
  }).join('');
  return rows?'<div class="dp-sec"><div class="dp-sec-hd">Attributs</div>'+rows+'</div>':'';
}
function dpPhoto(p){var h=photoHtml(p);return h?'<div class="dp-photo-w">'+h+'</div>':'';}
function dpSp(p){
  if(!p._sp_url||p._sp_url==="null"||p._sp_url==="None")return'';
  return'<div class="dp-actions"><a class="dp-sp" href="'+esc(c(p._sp_url))+'" target="_blank">📂 SharePoint</a></div>';
}
function featureKey(type,p){
  var id=c(p.CODE_OBJET||p.code_objet||p.NOM_ACCES||p.Name||p.name||p.CODE||p.code||p.cd_sig||p.Appellation||p.libelle||"");
  return (type+"_"+id).replace(/[^\w]/g,"_").slice(0,50);
}
function _dpjItems(code){
  var list=getPJList(code);
  return list.length?list.map(function(p,i){
    var d="";try{d=new Date(p.date).toLocaleDateString("fr-FR");}catch(e){}
    return'<div class="dpj-item"><a href="'+p.data+'" download="'+esc(p.name)+'">📄 '+esc(p.name)+'</a>'+
      '<span class="dpj-date">'+d+'</span>'+
      '<button class="pj-del" onclick="dpjDel(\''+esc(code)+'\','+i+')">✕</button></div>';
  }).join(''):'<div class="dpj-empty">Aucune pièce jointe</div>';
}
function dpPJWrap(code){
  var sc=esc(code),cnt=getPJList(code).length;
  return'<div class="dpj">'+
    '<div class="dpj-hd"><span class="dpj-lbl">📎 Pièces jointes</span>'+
    '<span class="dpj-cnt" id="dpj-cnt-'+sc+'">'+cnt+'</span></div>'+
    '<div id="dpj-'+sc+'">'+_dpjItems(code)+'</div>'+
    '<label class="dpj-add">➕ Ajouter un fichier'+
    '<input type="file" multiple style="display:none" onchange="dpjAdd(\''+sc+'\',this)"/></label>'+
    '</div>';
}
function dpjDel(code,idx){
  var list=getPJList(code);list.splice(idx,1);savePJList(code,list);
  var el=document.getElementById("dpj-"+code);if(el)el.innerHTML=_dpjItems(code);
  var cnt=document.getElementById("dpj-cnt-"+code);if(cnt)cnt.textContent=list.length;
}
function dpjAdd(code,input){
  var files=Array.from(input.files),list=getPJList(code),toRead=files.length;
  files.forEach(function(file){
    var reader=new FileReader();
    reader.onload=function(e){
      list.push({name:file.name,data:e.target.result,type:file.type,date:new Date().toISOString()});
      toRead--;if(!toRead){
        savePJList(code,list);
        var el=document.getElementById("dpj-"+code);if(el)el.innerHTML=_dpjItems(code);
        var cnt=document.getElementById("dpj-cnt-"+code);if(cnt)cnt.textContent=list.length;
      }
    };reader.readAsDataURL(file);
  });input.value="";
}

// ── Copier PK (terrain) ─────────────────────────────────────────────────────
function dpCopyPK(pk){
  if(!pk)return;
  var done=function(){showNetToast('📋 PK copié : '+pk);};
  if(navigator.clipboard){navigator.clipboard.writeText(pk).then(done).catch(done);}
  else{try{var t=document.createElement('textarea');t.value=pk;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);}catch(e){}done();}
}
function dpPkBar(pkFmt){
  if(!pkFmt)return '';
  return '<div class="dp-actions"><button class="dp-sp" onclick="dpCopyPK(\''+esc(pkFmt)+'\')" '+
    'style="background:#fff3e0;color:#e65100;border:1px solid #ffe0b2;cursor:pointer">📋 '+esc(pkFmt)+'</button></div>';
}
// ── Swipe-down pour fermer panneau détail sur mobile ─────────────────────────
(function(){
  var dp=document.getElementById('detail-panel'),sy=0;
  dp.addEventListener('touchstart',function(e){sy=e.touches[0].clientY;},{passive:true});
  dp.addEventListener('touchend',function(e){if(e.changedTouches[0].clientY-sy>70)closeDetail();},{passive:true});
})();
// ── Ouverture panneau ───────────────────────────────────────────────────────
function openDetailGeneric(badge,title,p,color){
  var body=dpHero(badge,title,"",color)+dpPhoto(p)+dpAllFields(p)+dpSp(p);
  openDetail(title,body);
}
function openDetailOAPoly(p){
  var code=c(p.LIBELLE_COURT||p.CODE_OBJET||""),lib=c(p.LIBELLE||p.LIBELLE_LO||"");
  var title=code?(code+(lib&&lib!==code?" – "+lib:"")):(lib||"OA");
  var pk=c(p.PKEF||p._pk_fmt);
  var body=dpHero("OA",title,"","#00bcd4")+
    dpPkBar(pk)+
    dpPhoto(p)+
    dpSec("Localisation",[["PK EF",pk],["Commune",p.COMMUNE]])+
    dpSec("Caractéristiques",[["Type",p.TYPE||p.LIBELLE_FA],["Infrastructure portée",p.INFRA_PORTEE],
      ["Infrastructure franchie",p.INFRA_FRANCHIE],["Hauteur libre",p.HAUTEUR_LIBRE?(c(p.HAUTEUR_LIBRE)+" m"):""],
      ["Longueur biaisée",p.LONGUEUR_BIAISE?(c(p.LONGUEUR_BIAISE)+" m"):""]])+
    dpSp(p)+dpPJWrap(code||featureKey("OA",p));
  openDetail("🏗 "+title,body);
}
function openDetailOA(p){
  var code=c(p.CODE_OBJET),lib=c(p.LIBELLE_LO);
  var body=dpHero("OA",code,lib,"#00bcd4")+
    dpPkBar(c(p._pk_fmt))+
    dpPhoto(p)+
    dpSec("Localisation",[["PK",p._pk_fmt],["Voie",p.VOIE],["Commune",p.COMMUNE],["Département",p.DEPARTEMEN]])+
    dpSec("Caractéristiques",[["Famille",p.LIBELLE_FA],["Type",p.LIBELLE_TY||p.TYPE_OBJ],["Dimensions",p.DIMENSIONS]])+
    dpSp(p)+dpPJWrap(code||featureKey("OA",p));
  openDetail("🏗 "+(code?code+" – ":"")+lib,body);
}
function openDetailOH(p){
  var code=c(p.code_objet),lib=c(p.libelle_ob);
  var body=dpHero("OH",code,lib,"#ef6c00")+
    dpPkBar(c(p._pk_fmt))+
    dpPhoto(p)+
    dpSec("Localisation",[["PK",p._pk_fmt],["Voie",p.voie],["Cours d'eau",p.ecoul_nom]])+
    dpSec("Caractéristiques",[["Type",p.type_objet],["Structure",p.structure],
      ["Longueur",p.longueur?(c(p.longueur)+" m"):""],["Radier",p.radier],["Diamètre",p.diametre]])+
    dpSp(p)+dpPJWrap(code||featureKey("OH",p));
  openDetail("💧 "+(code?code+" – ":"")+lib,body);
}
function openDetailPAM(p){
  var lib=c(p.libelle||p.axe||"PAM");
  var pkRef=c(p.pk_ef||p.pk_gc);
  var body=dpHero("PAM",lib,"","#9c27b0")+
    dpPkBar(pkRef)+
    dpPhoto(p)+
    dpSec("Localisation",[["Axe",p.axe],["PK EF",p.pk_ef],["PK GC",p.pk_gc],["Décalage",p.decalage]])+
    (c(p.commentair)?dpSec("Commentaire",[["Note",p.commentair]]): "")+
    dpSp(p);
  openDetail("🌱 "+lib,body);
}

/* ── PWA Install ── */
var _installPrompt=null;
// Masquer le bouton install si déjà en mode standalone (PWA installée)
(function(){
  var inStandalone=window.matchMedia('(display-mode:standalone)').matches||navigator.standalone;
  if(inStandalone){var b=document.getElementById('install-btn');if(b)b.style.display='none';}
})();
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();_installPrompt=e;
  var b=document.getElementById('install-btn');if(b)b.style.display='flex';
});
window.addEventListener('appinstalled',function(){
  _installPrompt=null;
  var b=document.getElementById('install-btn');if(b)b.style.display='none';
});
function installApp(){
  if(_installPrompt){
    _installPrompt.prompt();
    _installPrompt.userChoice.then(function(){_installPrompt=null;});
    return;
  }
  alert('📲 Installer l\'application :\n\n'
    +'✅ Android Chrome : ⋮ menu → "Ajouter à l\'écran d\'accueil"\n\n'
    +'🦊 Firefox Android : ⋮ menu → "Installer" ou "Ajouter à l\'écran d\'accueil"\n\n'
    +'🍎 Safari iOS : 🔗 (partager) → "Sur l\'écran d\'accueil"\n\n'
    +'💻 Chrome/Edge PC : icône 💻 dans la barre d\'adresse\n\n'
    +'💻 Firefox PC : ⋮ menu → "Installer ce site en tant qu\'app"');
}
window.installApp=installApp;

/* ── Statut réseau ── */
var _netToastTimer=null;
function showNetToast(msg){
  var t=document.getElementById('net-toast');
  if(!t)return;
  t.textContent=msg;t.style.display='block';t.style.opacity='1';
  clearTimeout(_netToastTimer);
  _netToastTimer=setTimeout(function(){t.style.opacity='0';setTimeout(function(){t.style.display='none';},300);},3000);
}
function updateNetBadge(){
  var b=document.getElementById('ver-badge');
  if(b)b.textContent=APP_VER+(navigator.onLine?' 🟢':' 🔴');
  var ob=document.getElementById('offline-btn');
  if(ob){
    var cached=localStorage.getItem('lgv_cached_v14');
    ob.dataset.state=!navigator.onLine?(cached?'ready':'offline'):(cached?'ready':'');
  }
}
window.addEventListener('online',function(){updateNetBadge();showNetToast('🟢 En ligne');});
window.addEventListener('offline',function(){updateNetBadge();showNetToast('🔴 Hors ligne – mode cache actif');});

/* ── Mise en cache pour usage hors-ligne ── */
async function warmOfflineCache(){
  var btn=document.getElementById('offline-btn');
  if(!navigator.onLine){showNetToast('🔴 Hors ligne – impossible de mettre à jour le cache');return;}
  var files=[
    'data/rail.geojson','data/pk.geojson','data/pk_hecto.geojson',
    'data/oa.geojson','data/oa_poly.geojson','data/oh.geojson',
    'data/pam.geojson','data/acces.geojson','data/old.geojson',
    'data/mc.geojson','data/n2.geojson','data/eco.geojson','data/bois.geojson',
    'index.html','sw.js','manifest.json',
    'icons/icon-192.png','icons/icon-512.png'
  ];
  if(btn){btn.textContent='⏳';btn.disabled=true;btn.dataset.state='';}
  var done=0,total=files.length;
  // Fetches parallèles par lots de 4 (SW intercepte et met en cache chaque réponse)
  for(var i=0;i<files.length;i+=4){
    await Promise.all(files.slice(i,i+4).map(function(f){
      return fetch(f).then(function(){done++;if(btn)btn.title='Cache: '+done+'/'+total;})
               .catch(function(){done++;});
    }));
  }
  try{localStorage.setItem('lgv_cached_v14','1');}catch(e){}
  if(btn){btn.textContent='✅';btn.title='Carte disponible hors-ligne ✓';}
  showNetToast('✅ Carte disponible hors-ligne');
  setTimeout(function(){if(btn){btn.textContent='📶';btn.disabled=false;}updateNetBadge();},2500);
}
window.warmOfflineCache=warmOfflineCache;

/* ── PWA Service Worker – mise à jour automatique ── */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    updateNetBadge();
    var reloading=false;
    navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'})
    .then(function(reg){
      updateNetBadge();
      reg.update();
      reg.addEventListener('updatefound',function(){
        var w=reg.installing;
        if(!w)return;
        w.addEventListener('statechange',function(){
          /* skipWaiting() est appelé dans l'install event du SW → l'état saute
             directement installing→activating sans passer par 'installed'.
             On envoie SKIP_WAITING sur 'activating' aussi pour couvrir les deux cas. */
          if(w.state==='installed'||w.state==='activating'){
            w.postMessage({type:'SKIP_WAITING'});
          }
        });
      });
      /* Vérification périodique toutes les 10 min (sessions longues) */
      setInterval(function(){reg.update();},10*60*1000);
    }).catch(function(e){console.warn('SW:',e);});
    navigator.serviceWorker.addEventListener('controllerchange',function(){
      if(!reloading){reloading=true;window.location.reload();}
    });
  });
}
