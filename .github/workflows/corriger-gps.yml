name: Publier GPS terrain et PK 1 m v3.92

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verifier les fichiers
        run: |
          test -s index_v3_reviewed.html
          test -s corriger_gps_lgv.py
      - name: Publier le HTML relu
        run: python corriger_gps_lgv.py
      - name: Verifier la version et les corrections
        run: |
          grep -q "v3.92-terrain-pk1m" index_v3.html
          grep -q "https://data.geopf.fr/wmts?" index_v3.html
          grep -q "function _gpsFreshRequest()" index_v3.html
          grep -q "PK métrique source 1 m" index_v3.html
          grep -q "aucune valeur PK de secours" index_v3.html
          ! grep -q "wxs.ign.fr/decouverte" index_v3.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index_v3.html
          if git diff --cached --quiet; then
            echo "Aucune modification"
          else
            git commit -m "GPS terrain PK 1 m et fond IGN v3.92"
            git push origin HEAD:main
          fi
