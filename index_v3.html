/* ═══════════════════════════════════════════════════════════
   LOCALISATION TEMPS RÉEL — v4.12
   ────────────────────────────────────────────────────────────
   Correctifs clés vs v4.11 :
   • _mapReady remplace map.loaded() (bug : map.loaded() = false
     pendant easeTo/pan → chaque fix GPS était rejeté → point bleu figé)
   • zone caméra resserrée (35–65 % / 40–60 %)
   • zoom 16 forcé au premier recentrage si zoom courant < 14
   • watchdog relancé systématiquement à la reprise Firefox
   ═══════════════════════════════════════════════════════════ */
var _gpsWatch=null;
var _gpsFollowing=true;
var _gpsCameraMoving=false;
var _gpsCameraInitialized=false;
var _gpsSessionId=0;
var _gpsWanted=false;
var _gpsBackgrounded=false;
var _gpsRestartTimer=null;
var _gpsRetryTimer=null;
var _gpsWatchdog=null;
var _gpsLastWatchEvent=0;
var _gpsRestarting=false;

var _gpsLastRaw=null;
var _gpsLastAccepted=null;
var _gpsDisplayed=null;
var _gpsMatch=null;

var _gpsLastCameraTs=0;
var _gpsLastPKUpdate=0;
var _gpsLastFixAt=0;
var _gpsFixCount=0;
var _gpsSameCoordCount=0;
var _gpsLastStatusTs=0;

var GPS_MAX_ACCURACY=500;
var GPS_PK_MAX_ACCURACY=30;
var GPS_STALE_MS=10000;
var GPS_WATCH_TIMEOUT=20000;
var GPS_PK_THROTTLE_MS=800;

var _gpsSources={point:null,circle:null,heading:null};
var _gpsLayersReady=false;
/* Cache du dernier rendu, sert à éviter des setData identiques. */
var _gpsLastRendered=null;

function _gpsResetState(){
  _gpsLastRaw=null;
  _gpsLastAccepted=null;
  _gpsDisplayed=null;
  _gpsMatch=null;
  _gpsLastPKUpdate=0;
  _gpsLastFixAt=0;
  _gpsFixCount=0;
  _gpsSameCoordCount=0;
  _gpsLastStatusTs=0;
  _gpsCameraInitialized=false;
  _gpsLastCameraTs=0;
  _gpsLastRendered=null;
  if(typeof _pkMatchState!=='undefined')_pkMatchState.last=null;
  try{window.GPS=null;}catch(e){}
}
function _gpsAge(p){return p&&p.receivedAt?Math.max(0,Date.now()-p.receivedAt):Infinity;}
function _gpsClamp(v,a,b){return Math.max(a,Math.min(b,v));}
function _gpsBearing(lat1,lng1,lat2,lng2){
  var p=Math.PI/180,dL=(lng2-lng1)*p;
  var y=Math.sin(dL)*Math.cos(lat2*p);
  var x=Math.cos(lat1*p)*Math.sin(lat2*p)-Math.sin(lat1*p)*Math.cos(lat2*p)*Math.cos(dL);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function _gpsCircle(lng,lat,r){
  var a=[],R=6378137,cl=Math.max(.15,Math.cos(lat*Math.PI/180));
  for(var i=0;i<=64;i++){
    var q=i/64*Math.PI*2,dx=Math.cos(q)*r,dy=Math.sin(q)*r;
    a.push([lng+dx/(R*cl)*180/Math.PI,lat+dy/R*180/Math.PI]);
  }
  return{type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[a]}};
}
function _gpsHeadingWedge(lng,lat,heading,r){
  if(!isFinite(heading))return emptyFC();
  var a=[[lng,lat]],R=6378137,cl=Math.max(.15,Math.cos(lat*Math.PI/180));
  for(var i=0;i<=18;i++){
    var h=(heading-28+56*i/18)*Math.PI/180,dx=Math.sin(h)*r,dy=Math.cos(h)*r;
    a.push([lng+dx/(R*cl)*180/Math.PI,lat+dy/R*180/Math.PI]);
  }
  a.push([lng,lat]);
  return{type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[a]}};
}
function _gpsQuality(a){return a<=5?'EXCELLENTE':a<=10?'TRÈS BONNE':a<=20?'BONNE':a<=40?'MOYENNE':a<=80?'FAIBLE':'INSUFFISANTE';}

function _ensureGpsLayers(){
  if(_gpsLayersReady&&_gpsSources.point&&_gpsSources.circle&&_gpsSources.heading)return;
  if(!map.getSource('_gpsCircle'))map.addSource('_gpsCircle',{type:'geojson',data:emptyFC()});
  if(!map.getLayer('_gpsCircleFill'))map.addLayer({id:'_gpsCircleFill',type:'fill',source:'_gpsCircle',paint:{'fill-color':'#4285f4','fill-opacity':.12}});
  if(!map.getLayer('_gpsCircleLine'))map.addLayer({id:'_gpsCircleLine',type:'line',source:'_gpsCircle',paint:{'line-color':'#4285f4','line-width':1.2,'line-opacity':.55}});
  if(!map.getSource('_gpsHeading'))map.addSource('_gpsHeading',{type:'geojson',data:emptyFC()});
  if(!map.getLayer('_gpsHeadingFill'))map.addLayer({id:'_gpsHeadingFill',type:'fill',source:'_gpsHeading',paint:{'fill-color':'#4285f4','fill-opacity':.10}});
  if(!map.getSource('_gpsPoint'))map.addSource('_gpsPoint',{type:'geojson',data:emptyFC()});
  if(!map.getLayer('_gpsHalo'))map.addLayer({id:'_gpsHalo',type:'circle',source:'_gpsPoint',paint:{'circle-radius':14,'circle-color':'#4285f4','circle-opacity':.18}});
  if(!map.getLayer('_gpsDot'))map.addLayer({id:'_gpsDot',type:'circle',source:'_gpsPoint',paint:{'circle-radius':7,'circle-color':'#4285f4','circle-stroke-width':3,'circle-stroke-color':'#fff'}});
  _gpsSources.point=map.getSource('_gpsPoint');
  _gpsSources.circle=map.getSource('_gpsCircle');
  _gpsSources.heading=map.getSource('_gpsHeading');
  _gpsLayersReady=!!(_gpsSources.point&&_gpsSources.circle&&_gpsSources.heading);
}

function _updateGpsStatus(p,force){
  var el=document.getElementById('gps-status');if(!el)return;
  var now=Date.now();
  if(!force&&now-_gpsLastStatusTs<250)return;
  _gpsLastStatusTs=now;
  if(!p){
    el.innerHTML='<div class="gps-title">📍 GPS temps réel</div>'+
      '<div class="gps-line gps-bad">GPS en attente / autorisation requise</div>';
    el.style.display='block';
    return;
  }

  var age=_gpsAge(p),stale=age>GPS_STALE_MS;
  var sp=p.speed!=null&&p.speed>.4?Math.round(p.speed*3.6)+' km/h':'0 km/h';
  var state=stale?'GPS PERDU':(p.accuracy<=10?'GPS PRÉCIS':p.accuracy<=20?'GPS BON':p.accuracy<=50?'GPS MOYEN':'GPS FAIBLE');
  var cls=stale?'gps-bad':(p.accuracy<=20?'gps-good':'gps-mid');
  var m=_gpsMatch&&_gpsMatch.label?' · PK '+_gpsMatch.label:' · PK —';
  var voie=_gpsMatch&&_gpsMatch.voie?' · V '+_gpsMatch.voie:'';
  var jump=p.gpsJump?' · ⚠ saut détecté':'';
  var delta=_gpsLastRaw&&_gpsLastRaw.deltaMeters!=null?_gpsLastRaw.deltaMeters.toFixed(2)+' m':'—';
  el.innerHTML=
    '<div class="gps-title">📍 GPS temps réel</div>'+
    '<div class="gps-line '+cls+'">'+state+' · ±'+Math.round(p.accuracy)+' m · '+sp+'</div>'+
    '<div class="gps-line">Lat '+p.lat.toFixed(6)+' · Lng '+p.lng.toFixed(6)+'</div>'+
    '<div class="gps-line">'+(_gpsFollowing?'🎯 Suivi actif':'🖐 Carte libre')+m+voie+jump+'</div>'+
    '<div class="gps-line" style="opacity:.6">Fixes: '+_gpsFixCount+' · âge '+(age===Infinity?'—':(age/1000).toFixed(1)+' s')+'</div>'+
    '<div class="gps-line" style="opacity:.55">Δ '+delta+' · mêmes fixes '+_gpsSameCoordCount+' · qualité '+_gpsQuality(p.accuracy)+'</div>';
  el.style.display='block';
}

function _setLocateButton(){
  var b=document.getElementById('locate-btn');if(!b)return;
  if(_gpsWatch===null){b.style.background='white';b.style.color='#111';}
  else if(_gpsFollowing){b.style.background='#4285f4';b.style.color='white';}
  else{b.style.background='#dbeafe';b.style.color='#1565c0';}
}

/* Position affichée = copie exacte du dernier fix validé. */
function _gpsBuildDisplayed(raw){
  return {
    lat:raw.lat,lng:raw.lng,accuracy:raw.accuracy,
    speed:raw.speed,heading:raw.heading,
    timestamp:raw.timestamp,receivedAt:raw.receivedAt,
    rawLat:raw.lat,rawLng:raw.lng,gpsJump:!!raw.gpsJump,
    jumpDistance:raw.jumpDistance,deltaMeters:raw.deltaMeters
  };
}

function _gpsAccept(pos){
  var c=pos&&pos.coords||{};
  var lat=Number(c.latitude),lng=Number(c.longitude),acc=Number(c.accuracy);
  if(!Number.isFinite(lat)||!Number.isFinite(lng))return null;
  if(lat<-90||lat>90||lng<-180||lng>180)return null;
  if(!Number.isFinite(acc)||acc<=0)acc=GPS_MAX_ACCURACY;
  if(acc>GPS_MAX_ACCURACY)return null;

  var receivedAt=Date.now();
  var deviceTs=Number(pos.timestamp)||receivedAt;
  if(!Number.isFinite(deviceTs)||Math.abs(receivedAt-deviceTs)>60000)deviceTs=receivedAt;

  var speed=Number(c.speed);
  if(!Number.isFinite(speed)||speed<0||speed>100)speed=null;
  var heading=Number(c.heading);
  if(!Number.isFinite(heading)||heading<0||heading>=360)heading=null;

  var raw={lat:lat,lng:lng,accuracy:acc,timestamp:deviceTs,receivedAt:receivedAt,speed:speed,heading:heading,gpsJump:false};

  if(_gpsLastRaw){
    var dt=Math.max(.1,(receivedAt-_gpsLastRaw.receivedAt)/1000);
    var d=_haversine(_gpsLastRaw.lat,_gpsLastRaw.lng,lat,lng);
    raw.deltaMeters=d;
    raw.jumpDistance=d;
    raw.gpsJump=(d>500&&dt<10&&speed!=null&&speed<2);
  }else{
    raw.deltaMeters=null;raw.jumpDistance=0;
  }

  if(_gpsLastAccepted){
    if(raw.deltaMeters!=null&&raw.deltaMeters>=.2){
      _gpsSameCoordCount=0;
    }else{
      _gpsSameCoordCount++;
    }
  }else{
    _gpsSameCoordCount=0;
  }

  _gpsLastRaw=raw;
  _gpsLastFixAt=receivedAt;
  _gpsFixCount++;

  var displayed=_gpsBuildDisplayed(raw);
  _gpsLastAccepted=displayed;
  _gpsDisplayed=displayed;

  window.GPS={last:displayed,raw:raw,filtered:displayed,match:_gpsMatch,
    accuracy:acc,age:0,count:_gpsFixCount,jump:!!raw.gpsJump};
  return displayed;
}

/* Rendu événementiel : 1 appel quand un fix arrive.
   ⚠ NE PAS utiliser map.loaded() : retourne false pendant easeTo, ce qui
   rejetait silencieusement chaque fix et figeait le point bleu.
   On utilise le flag _mapReady levé une seule fois sur map.on('load'). */
function _drawGpsFix(p,forceCamera){
  if(!p||!_mapReady)return;
  _ensureGpsLayers();
  if(!_gpsLayersReady)return;

  var rlast=_gpsLastRendered;
  var moved=!rlast||rlast.lat!==p.lat||rlast.lng!==p.lng;
  var accuracyChanged=!rlast||rlast.accuracy!==p.accuracy||moved;
  var headingChanged=!rlast||rlast.heading!==p.heading||rlast.speed!==p.speed||moved;

  if(moved){
    _gpsSources.point.setData({
      type:'Feature',
      properties:{accuracy:p.accuracy,heading:p.heading,speed:p.speed,gpsJump:!!p.gpsJump},
      geometry:{type:'Point',coordinates:[p.lng,p.lat]}
    });
  }
  if(accuracyChanged){
    _gpsSources.circle.setData(_gpsCircle(p.lng,p.lat,Math.max(3,p.accuracy)));
  }
  if(headingChanged){
    _gpsSources.heading.setData(
      p.heading!=null&&p.speed!=null&&p.speed>1
        ?_gpsHeadingWedge(p.lng,p.lat,p.heading,Math.max(15,Math.min(55,p.speed*1.2+12)))
        :emptyFC()
    );
  }

  _gpsLastRendered={lat:p.lat,lng:p.lng,accuracy:p.accuracy,heading:p.heading,speed:p.speed,receivedAt:p.receivedAt};
  _updateGpsStatus(p,false);
  _gpsMoveCamera(p,!!forceCamera);
}
function _invalidateGpsRenderCache(){_gpsLastRendered=null;}

/* Zone caméra resserrée : le point est recentré dès qu'il s'éloigne du cœur d'écran. */
function _gpsCameraNeedsRecenter(p,force){
  if(force||!_gpsCameraInitialized)return true;
  try{
    var size=map.getContainer(),w=size.clientWidth,h=size.clientHeight;
    if(!w||!h)return true;
    var pt=map.project([p.lng,p.lat]);
    return pt.x<w*0.35||pt.x>w*0.65||pt.y<h*0.40||pt.y>h*0.60;
  }catch(e){return false;}
}
function _gpsMoveCamera(p,force){
  if(!_gpsFollowing||_gpsBackgrounded||!p||!_mapReady)return;
  if(!_gpsCameraNeedsRecenter(p,force))return;
  var now=Date.now();
  if(!force&&now-_gpsLastCameraTs<180)return;
  _gpsLastCameraTs=now;
  _gpsCameraMoving=true;

  var firstFix=!_gpsCameraInitialized;
  _gpsCameraInitialized=true;

  /* Au premier fix, on force un zoom exploitable (sinon on garde le zoom choisi). */
  var targetZoom=map.getZoom();
  if(firstFix && targetZoom<14)targetZoom=16;

  try{map.stop();}catch(e){}
  map.easeTo({
    center:[p.lng,p.lat],
    zoom:firstFix?targetZoom:map.getZoom(),
    duration:firstFix?350:250,
    essential:true
  });
  setTimeout(function(){_gpsCameraMoving=false;},firstFix?380:280);
}

function _gpsErrorMessage(e){
  if(!e)return 'erreur GPS';
  if(e.code===1)return 'autorisation refusée';
  if(e.code===2)return 'position indisponible';
  if(e.code===3)return 'délai GPS dépassé';
  return 'erreur GPS';
}

function _gpsDrawAndMatch(p,force){
  if(!p)return;
  _drawGpsFix(p,!!force);
  if(p.accuracy>GPS_PK_MAX_ACCURACY){
    _gpsMatch=null;
    if(window.GPS)window.GPS.match=null;
    _updateGpsStatus(p,false);
    return;
  }
  var now=Date.now();
  if(force||now-_gpsLastPKUpdate>=GPS_PK_THROTTLE_MS){
    _gpsLastPKUpdate=now;
    var snapshot={lat:p.lat,lng:p.lng,accuracy:p.accuracy,speed:p.speed,heading:p.heading,timestamp:p.timestamp,receivedAt:p.receivedAt};
    setTimeout(function(){
      try{
        var m=_bestPkMetricMatch(snapshot);
        if(m){_gpsMatch=m;if(window.GPS)window.GPS.match=m;_updateGpsStatus(_gpsLastAccepted||snapshot,false);}
      }catch(e){console.warn('PK match:',e);}
    },0);
  }
}

function _gpsClearWatchdog(){
  if(_gpsWatchdog){clearInterval(_gpsWatchdog);_gpsWatchdog=null;}
  if(_gpsRestartTimer){clearTimeout(_gpsRestartTimer);_gpsRestartTimer=null;}
  if(_gpsRetryTimer){clearTimeout(_gpsRetryTimer);_gpsRetryTimer=null;}
}
function _gpsStopNativeWatch(){
  _gpsSessionId++;
  if(_gpsWatch!==null){try{navigator.geolocation.clearWatch(_gpsWatch);}catch(e){} _gpsWatch=null;}
  _setLocateButton();
}
function _gpsStartWatch(){
  if(!navigator.geolocation||_gpsWatch!==null||_gpsRestarting||_gpsBackgrounded)return false;
  var session=++_gpsSessionId;
  _gpsLastWatchEvent=Date.now();
  try{
    _gpsWatch=navigator.geolocation.watchPosition(function(pos){
      if(session!==_gpsSessionId||_gpsBackgrounded)return;
      _gpsLastWatchEvent=Date.now();
      var p=_gpsAccept(pos);
      if(p)_gpsDrawAndMatch(p,false);
    },function(e){
      if(session!==_gpsSessionId||_gpsBackgrounded)return;
      _gpsLastWatchEvent=Date.now();
      showNetToast('📍 '+_gpsErrorMessage(e));
      _updateGpsStatus(_gpsLastAccepted,true);
    },{
      enableHighAccuracy:true,
      maximumAge:0,
      timeout:GPS_WATCH_TIMEOUT
    });
  }catch(e){
    _gpsWatch=null;
    showNetToast('📍 GPS non disponible dans ce navigateur');
    return false;
  }
  _setLocateButton();
  return true;
}
function _gpsRestartWatch(){
  if(_gpsRestarting||!navigator.geolocation||!_gpsWanted||_gpsBackgrounded)return;
  _gpsRestarting=true;
  _gpsStopNativeWatch();
  _gpsRestartTimer=setTimeout(function(){
    _gpsRestartTimer=null;
    _gpsRestarting=false;
    if(!_gpsWanted||_gpsBackgrounded)return;
    _gpsStartWatch();
    _setLocateButton();
    var fixBefore=_gpsLastFixAt;
    _gpsRetryTimer=setTimeout(function(){
      _gpsRetryTimer=null;
      if(_gpsWanted&&!_gpsBackgrounded&&_gpsWatch!==null&&_gpsLastFixAt===fixBefore)_gpsRestartWatch();
    },5000);
  },250);
}
function _gpsStartWatchdog(){
  _gpsClearWatchdog();
  _gpsWatchdog=setInterval(function(){
    if(_gpsWatch===null||_gpsBackgrounded)return;
    var silence=Date.now()-_gpsLastWatchEvent;
    if(silence>16000)_gpsRestartWatch();
  },5000);
}

function startLiveLocation(follow){
  if(!navigator.geolocation){showNetToast('📍 Géolocalisation indisponible');return false;}
  _gpsWanted=true;
  _gpsBackgrounded=false;
  if(typeof follow==='boolean')_gpsFollowing=follow;
  if(_gpsWatch!==null){
    _setLocateButton();
    if(_gpsLastAccepted)_gpsMoveCamera(_gpsLastAccepted,true);
    return true;
  }
  _gpsResetState();
  _invalidateGpsRenderCache();
  showNetToast('📡 GPS haute précision — acquisition…');
  if(!_gpsStartWatch())return false;
  _gpsStartWatchdog();
  _setLocateButton();
  return true;
}
function stopLiveLocation(){
  _gpsWanted=false;
  _gpsBackgrounded=false;
  _gpsRestarting=false;
  _gpsStopNativeWatch();
  _gpsClearWatchdog();
  _gpsResetState();
  _invalidateGpsRenderCache();
  _setLocateButton();
  _updateGpsStatus(null,true);
  showNetToast('📍 Suivi GPS arrêté');
}
function locateMe(){
  if(_gpsWatch===null){startLiveLocation(true);return;}
  _gpsWanted=true;
  _gpsFollowing=true;
  _setLocateButton();
  if(_gpsLastAccepted)_gpsMoveCamera(_gpsLastAccepted,true);
  showNetToast('📍 Suivi temps réel actif');
}
window.locateMe=locateMe;
window.startLiveLocation=startLiveLocation;
window.stopLiveLocation=stopLiveLocation;

map.on('dragstart',function(){if(_gpsWatch!==null&&!_gpsCameraMoving){_gpsFollowing=false;_setLocateButton();_updateGpsStatus(_gpsLastAccepted,true);}});
map.on('zoomstart',function(){if(_gpsWatch!==null&&!_gpsCameraMoving){_gpsFollowing=false;_setLocateButton();}});
map.on('rotatestart',function(){if(_gpsWatch!==null&&!_gpsCameraMoving){_gpsFollowing=false;_setLocateButton();}});

function _gpsPauseLifecycle(){
  if(!_gpsWanted)return;
  _gpsBackgrounded=true;
  _gpsRestarting=false;
  _gpsStopNativeWatch();
  _gpsClearWatchdog();
  _updateGpsStatus(_gpsLastAccepted,true);
}
function _gpsResumeLifecycle(){
  if(!_gpsWanted)return;
  _gpsBackgrounded=false;
  if(_gpsWatch===null){
    _gpsResetState();
    _invalidateGpsRenderCache();
    _gpsLastStatusTs=0;                    /* force refresh du panneau GPS */
    if(_gpsStartWatch()){
      _gpsStartWatchdog();                 /* ← toujours relancer le watchdog */
    }
  }
}

map.once('load',function(){
  _setLocateButton();
  _updateGpsStatus(null,true);
  if(navigator.geolocation){
    startLiveLocation(true);
  }
});

document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='hidden'){
    _gpsPauseLifecycle();
  }else{
    _gpsResumeLifecycle();
  }
});
window.addEventListener('pagehide',function(){_gpsPauseLifecycle();});
window.addEventListener('pageshow',function(){_gpsResumeLifecycle();});

function _getFreshHighAccuracyPosition(done){
  if(_gpsWatch===null)startLiveLocation(false);
  var started=Date.now(),lastTs=_gpsLastAccepted?_gpsLastAccepted.receivedAt:0;
  function wait(){
    if(_gpsLastAccepted&&_gpsLastAccepted.receivedAt>lastTs&&_gpsAge(_gpsLastAccepted)<=3000&&_gpsLastAccepted.accuracy<=GPS_PK_MAX_ACCURACY){
      done(_gpsLastAccepted);return;
    }
    if(Date.now()-started>9000){done(null);return;}
    setTimeout(wait,180);
  }
  wait();
}

/* ── Bouton PK? : cherche le PK / Accès / PAM le plus proche ── */
var _pkFindBusy=false;
function findNearest(){
  if(_pkFindBusy)return;
  _pkFindBusy=true;
  if(!navigator.geolocation){showNetToast('📍 Géolocalisation non disponible');_pkFindBusy=false;return;}
  if(!map.getSource('pk_metric')||!map.getLayer('pkm1-hit')){
    openDetail('📍 PK le plus proche','<div style="padding:16px">PK métrique indisponible.</div>');_pkFindBusy=false;return;
  }
  openDetail('📍 Éléments LGV proches','<div style="padding:18px;text-align:center;color:#888"><p style="font-size:14px;margin:0">📡 Position GPS haute précision…</p><p style="font-size:11px;margin-top:8px">Mesure fraîche obligatoire avant le calcul PK.</p></div>');
  _getFreshHighAccuracyPosition(function(p){
    if(!p){closeDetail();showNetToast('📍 Position GPS indisponible ou précision insuffisante');_pkFindBusy=false;return;}
    _gpsFollowing=true;_setLocateButton();
    /* Correctif v4.12 : _drawGps → _drawGpsFix (l'ancien nom n'existe plus) */
    _drawGpsFix(p,true);
    map.easeTo({center:[p.lng,p.lat],zoom:Math.max(map.getZoom(),19.5),duration:260,essential:true});
    var start=Date.now(),done=false;
    function run(){
      if(done)return;
      _refreshPkMetricCache(p);
      var m=_bestPkMetricMatch(p);
      if(m){done=true;_finishFindNearest(p.lat,p.lng,p.accuracy);_pkFindBusy=false;return;}
      if(Date.now()-start>=6500){done=true;_finishFindNearest(p.lat,p.lng,p.accuracy);_pkFindBusy=false;return;}
      setTimeout(run,250);
    }
    map.once('idle',run);
    setTimeout(run,350);
  });
}
window.findNearest=findNearest;

/* ══════════════════════════════════════════════════════════
   PK MÉTRIQUE : cache + map-matching
   ══════════════════════════════════════════════════════════ */
var _pkMetricCache=new Map();
var _pkMetricLastRefresh=0;
var _pkMetricLastCenter=null;
var _pkMatchState={last:null};

function _pkMetricKey(f){
  var co=f.geometry&&f.geometry.coordinates||[],p=f.properties||{};
  var pk=p._pk_label!=null?p._pk_label:p.pk;
  return co.length>=2?co[0].toFixed(7)+'|'+co[1].toFixed(7)+'|'+String(pk||''):'';
}
function _refreshPkMetricCache(center){
  if(!map.getSource('pk_metric'))return 0;
  var now=Date.now();
  if(now-_pkMetricLastRefresh<180)return 0;
  _pkMetricLastRefresh=now;
  var fs=[];
  try{
    fs=map.querySourceFeatures('pk_metric',{sourceLayer:'pk_metric'});
    fs.forEach(function(f){
      if(!f.geometry||f.geometry.type!=='Point')return;
      var k=_pkMetricKey(f);if(!k)return;
      var old=_pkMetricCache.get(k);
      if(old)old.seenAt=now;
      else _pkMetricCache.set(k,{props:Object.assign({},f.properties),geom:{type:'Point',coordinates:f.geometry.coordinates.slice()},seenAt:now});
    });
  }catch(e){console.warn('PK cache:',e);}
  _pkMetricLastCenter=center||_pkMetricLastCenter;
  if(center)_pkMetricCache.forEach(function(v,k){
    if(_haversine(center.lat,center.lng,v.geom.coordinates[1],v.geom.coordinates[0])>2200
       && now-v.seenAt>4000)_pkMetricCache.delete(k);
  });
  if(_pkMetricCache.size>16000){
    var a=[];_pkMetricCache.forEach(function(v,k){a.push([k,v.seenAt]);});
    a.sort(function(x,y){return x[1]-y[1];});
    for(var i=0;i<Math.max(0,a.length-12000);i++)_pkMetricCache.delete(a[i][0]);
  }
  return fs.length;
}
function _parsePKMeters(lbl){
  if(lbl==null)return -1;
  var s=String(lbl).trim(),m=s.match(/^(\d+)\s*\+\s*(\d{1,3})$/);
  if(m)return parseInt(m[1],10)*1000+parseInt(m[2],10);
  var n=Number(s);return isFinite(n)?Math.round(n):-1;
}
function _pkMetricLabel(p){
  var raw=p&&p._pk_label!=null?p._pk_label:(p&&p.pk!=null?p.pk:null);
  if(raw==null||raw==='')return '';
  var t=String(raw);
  if(t.indexOf('+')>=0)return t;
  var n=Number(raw);if(!isFinite(n))return t;
  return Math.floor(n/1000)+'+'+('000'+Math.round(n%1000)).slice(-3);
}
function _metricRenderedCandidates(lat,lng){
  if(!map.getLayer('pkm1-hit'))return[];
  try{
    var pt=map.project([lng,lat]);
    var acc=(_gpsLastRaw&&isFinite(_gpsLastRaw.accuracy))?_gpsLastRaw.accuracy:20;
    var radiusM=Math.max(25,Math.min(100,acc*2.4+10));
    var mpp=Math.max(.05,156543.03392*Math.cos(lat*Math.PI/180)/Math.pow(2,map.getZoom()));
    var rp=Math.max(20,Math.min(500,radiusM/mpp));
    return map.queryRenderedFeatures([[pt.x-rp,pt.y-rp],[pt.x+rp,pt.y+rp]],{layers:['pkm1-hit']});
  }catch(e){return[];}
}
function _candidatePool(lat,lng){
  var a=_metricRenderedCandidates(lat,lng),b=[],seen={},out=[];
  _pkMetricCache.forEach(function(f){
    if(_haversine(lat,lng,f.geom.coordinates[1],f.geom.coordinates[0])<=110)b.push(f);
  });
  a.concat(b).forEach(function(f){
    var k=_pkMetricKey(f);if(k&&!seen[k]){seen[k]=1;out.push({props:f.properties||{},geom:f.geometry});}
  });
  return out;
}
function _pkCandidateScore(f,p){
  var co=f.geom.coordinates,d=_haversine(p.lat,p.lng,co[1],co[0]);
  if(p.accuracy>GPS_PK_MAX_ACCURACY)return null;
  var maxD=Math.max(15,Math.min(100,p.accuracy*2.45+8));
  if(d>maxD)return null;
  var voie=String(f.props._voie||f.props.voie||f.props.VOIE||'').trim().toUpperCase();
  var pk=_parsePKMeters(f.props._pk_label!=null?f.props._pk_label:f.props.pk);
  var score=d,last=_pkMatchState.last;
  if(last){
    var dt=_gpsClamp((p.timestamp-last.timestamp)/1000,.25,5);
    var speed=p.speed!=null?p.speed:last.speed||0;
    var expected=Math.max(0,Math.min(140,speed*dt));
    if(last.voie&&voie){
      if(last.voie!==voie)score+=25;
      else if(last.pkMeters>=0&&pk>=0){
        var delta=pk-last.pkMeters,absDelta=Math.abs(delta),allowed=Math.max(80,expected*3+60);
        if(absDelta>allowed)score+=(absDelta-allowed)*2.5;
        if(expected>6&&p.heading!=null&&absDelta>4){
          var bearing=_gpsBearing(last.lat,last.lng,co[1],co[0]);
          var ad=Math.abs(((bearing-p.heading+540)%360)-180);
          if(ad>45)score+=(ad-45)*.8;
        }
      }
    }
    var geoD=_haversine(last.lat,last.lng,co[1],co[0]);
    var geoAllowed=Math.max(90,expected*3+80);
    if(geoD>geoAllowed)score+=(geoD-geoAllowed)*1.6;
  }
  return {f:f,d:d,score:score,voie:voie,pkMeters:pk};
}
function _bestPkMetricMatch(p){
  if(!p||p.accuracy>GPS_PK_MAX_ACCURACY)return null;
  _refreshPkMetricCache(p);
  var pool=_candidatePool(p.lat,p.lng),cand=[];
  pool.forEach(function(f){var x=_pkCandidateScore(f,p);if(x)cand.push(x);});
  cand.sort(function(a,b){return a.score-b.score;});
  if(!cand.length)return null;
  var best=cand[0],last=_pkMatchState.last;
  if(last&&last.voie&&best.voie&&best.voie!==last.voie){
    var same=cand.find(function(x){return x.voie===last.voie;});
    if(same&&best.score+10>=same.score)best=same;
  }
  var co=best.f.geom.coordinates,label=_pkMetricLabel(best.f.props);
  var out={lat:co[1],lng:co[0],d:best.d,score:best.score,voie:best.voie,label:label,pkMeters:best.pkMeters,props:best.f.props,geom:best.f.geom,timestamp:p.timestamp,speed:p.speed};
  _pkMatchState.last=out;
  return out;
}

/* ══════════════════════════════════════════════════════════
   DÉTECTION PK / ACCÈS / PAM LE PLUS PROCHE (findNearest)
   ══════════════════════════════════════════════════════════ */
function _haversine(lat1,lng1,lat2,lng2){
  var R=6371000,r=Math.PI/180;
  var dLat=(lat2-lat1)*r,dLng=(lng2-lng1)*r;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function _nearestOf(lat,lng,features){
  var best=null,bestD=Infinity;
  features.forEach(function(f){
    if(!f.geom||f.geom.type!=='Point')return;
    var d=_haversine(lat,lng,f.geom.coordinates[1],f.geom.coordinates[0]);
    if(d<bestD){bestD=d;best={f:f,d:d};}
  });
  return best;
}
function _nearestN(lat,lng,features,n){
  var scored=[];
  features.forEach(function(f){
    if(!f.geom||f.geom.type!=='Point')return;
    var d=_haversine(lat,lng,f.geom.coordinates[1],f.geom.coordinates[0]);
    scored.push({f:f,d:d});
  });
  scored.sort(function(a,b){return a.d-b.d;});
  return scored.slice(0,n);
}
function _dStr(m){return m<1000?Math.round(m)+' m':(m/1000).toFixed(2)+' km';}

function _parseVoie(v){
  var raw=String(v||'').trim().toUpperCase();
  if(!raw)return{b:'',s:''};
  if(raw==='LGV1'||raw==='V1'||raw==='LGV V1')return{b:'lgv',s:'1'};
  if(raw==='LGV2'||raw==='V2'||raw==='LGV V2')return{b:'lgv',s:'2'};
  if(raw==='LGV'||/^LGV[\s]/.test(raw))return{b:'lgv',s:''};
  var mR=raw.match(/^R([A-Z]+?)([12])$/)||raw.match(/^R([12])([A-Z]+)$/);
  if(mR){
    var letters,digit;
    if(/^[12]$/.test(mR[1])){digit=mR[1];letters=mR[2];}
    else{letters=mR[1];digit=mR[2];}
    var RMAP={J:'JU',V:'VN'};
    return{b:(RMAP[letters]||letters).toLowerCase(),s:digit};
  }
  var m=raw.match(/^([A-Z]+?)([12])$/)||raw.match(/^([12])([A-Z]+)$/);
  if(!m)return{b:raw.toLowerCase(),s:''};
  var letters3,digit3;
  if(/^[12]$/.test(m[1])){digit3=m[1];letters3=m[2];}
  else{letters3=m[1];digit3=m[2];}
  return{b:letters3.toLowerCase(),s:digit3};
}

function _finishFindNearest(lat,lng,acc){
  var live={lat:lat,lng:lng,accuracy:acc,timestamp:Date.now(),
            speed:(_gpsLastAccepted&&_gpsLastAccepted.speed)||0,
            heading:(_gpsLastAccepted&&_gpsLastAccepted.heading!=null)?_gpsLastAccepted.heading:null};
  var metric=_bestPkMetricMatch(live),npk=null,pkPrec='';
  if(metric){npk={f:{props:metric.props,geom:metric.geom},d:metric.d};pkPrec='PK métrique 1 m · map-matching';}
  if(!npk&&_pkHData&&_pkHData.features&&_pkHData.features.length){
    var hs=_pkHData.features.map(function(f){return{f:{props:f.properties,geom:f.geometry},d:_haversine(lat,lng,f.geometry.coordinates[1],f.geometry.coordinates[0])};});
    hs.sort(function(a,b){return a.d-b.d;});
    if(hs.length){npk=hs[0];pkPrec='secours PK 100 m';}
  }
  if(!npk&&layerData.pk.length){npk=_nearestOf(lat,lng,layerData.pk);if(npk)pkPrec='secours PK 1 km';}

  var pkVoie=npk?String(npk.f.props._voie||npk.f.props.voie||''):'';
  var pkP=_parseVoie(pkVoie);

  var accPool=layerData.acces;
  if(pkP.b){
    var accFiltered=accPool.filter(function(f){
      var a=_parseVoie(String(f.props.AXE||f.props.axe||''));
      return a.b===pkP.b&&(a.s===pkP.s||a.s==='');
    });
    if(accFiltered.length)accPool=accFiltered;
  }
  var naccs=_nearestN(lat,lng,accPool,3);

  var pamPool=layerData.pam;
  if(pkP.b){
    var pamFiltered=pamPool.filter(function(f){
      var a=_parseVoie(String(f.props.axe||f.props.AXE||''));
      return a.b===pkP.b&&(a.s===pkP.s||a.s==='');
    });
    if(pamFiltered.length)pamPool=pamFiltered;
  }
  var npams=_nearestN(lat,lng,pamPool,3);

  function zoomBtn(coords,z,label){
    var co=JSON.stringify(coords);
    return '<button onclick="map.flyTo({center:'+co+',zoom:'+z+'});closeDetail()" '+
      'style="font-size:10px;padding:2px 8px;border-radius:4px;border:1px solid #ccc;cursor:pointer;margin-top:4px">'+label+'</button>';
  }
  var html='<div style="padding:12px;display:flex;flex-direction:column;gap:10px">';
  var voieInfo=pkVoie?(pkP.b?(' · Voie <b>'+c(pkVoie)+'</b> → branche <b>'+pkP.b.toUpperCase()+'</b> côté <b>'+pkP.s+'</b>'):''):'' ;
  html+='<p style="font-size:11px;color:'+(pkPrec.indexOf('PK métrique')===0?'#2e7d32':'#c62828')+';font-weight:700;margin:0">📍 GPS : ±'+Math.round(acc)+' m · '+(pkPrec||'PK indisponible')+voieInfo+'</p>';
  if(npk&&npk.d!=null)html+='<p style="font-size:10.5px;color:#666;margin:-5px 0 0">Distance GPS ↔ PK : <b>'+_dStr(npk.d)+'</b></p>';

  if(npk){
    var p=npk.f.props,co=npk.f.geom.coordinates;
    var rawLbl=(pkPrec.indexOf('1 m')>=0)?_pkMetricLabel(p):(p._pk_label!=null?p._pk_label:(p.pk!=null?p.pk:null));
    var lbl;
    if(rawLbl!==null&&rawLbl!==undefined&&rawLbl!==''){
      var numV=parseFloat(rawLbl);
      if(!isNaN(numV)&&String(rawLbl).indexOf('+')===-1){
        if(numV>=1000){var km=Math.floor(numV/1000),m=Math.round(numV%1000);lbl='PK '+km+'+'+('000'+m).slice(-3);}
        else{lbl='PK '+Math.round(numV)+'+000';}
      }else{lbl='PK '+c(rawLbl);}
    }else{lbl=c(p.Name||'?');}
    html+='<div style="padding:10px;background:#fff3e0;border-radius:8px;border-left:4px solid #cc0000">';
    html+='<div style="font-size:11px;color:#888;font-weight:600;text-transform:uppercase;margin-bottom:4px">PK le plus proche</div>';
    html+='<div style="font-size:18px;font-weight:700;color:#cc0000">'+lbl+'</div>';
    if(pkPrec.indexOf('PK métrique')!==0)html+='<div style="font-size:10.5px;color:#c62828;font-weight:700;margin-top:3px">⚠ PK métrique indisponible : valeur de secours. Précision GPS : ±'+Math.round(acc)+' m.</div>';
    html+='<div style="font-size:12px;color:#555">Voie : <b>'+c(p._voie||p.voie||'—')+'</b>'+(pkP.b?' (branche '+pkP.b.toUpperCase()+', côté '+pkP.s+')':'')+'</div>';
    html+='<div style="font-size:13px;font-weight:600;margin-top:4px">'+_dStr(npk.d)+'</div>';
    html+=zoomBtn(co,18,'→ Zoom sur ce PK');
    html+='</div>';
  }else{html+='<div style="padding:8px;color:#aaa">PK : données non chargées</div>';}

  if(naccs.length){
    naccs.forEach(function(nacc,i){
      var p=nacc.f.props,co=nacc.f.geom.coordinates;
      html+='<div style="padding:10px;background:#fff8e1;border-radius:8px;border-left:4px solid #e65100">';
      html+='<div style="font-size:11px;color:#888;font-weight:600;text-transform:uppercase;margin-bottom:4px">'+(i===0?'Accès le plus proche':'Accès #'+(i+1))+'</div>';
      html+='<div style="font-size:15px;font-weight:700;color:#e65100">🚧 '+c(p.NOM_ACCES||p.Name||'Accès')+'</div>';
      if(p.AXE||p.axe)html+='<div style="font-size:12px;color:#555">Axe : <b>'+c(p.AXE||p.axe)+'</b></div>';
      if(p.PK)html+='<div style="font-size:12px;color:#555">PK : '+c(p.PK)+'</div>';
      html+='<div style="font-size:13px;font-weight:600;margin-top:4px">'+_dStr(nacc.d)+'</div>';
      html+=zoomBtn(co,16,'→ Zoom sur cet accès');
      html+='<div style="display:flex;gap:6px;margin-top:6px">'+
        '<a href="https://www.google.com/maps/dir/?api=1&destination='+co[1]+','+co[0]+'" target="_blank" rel="noopener" style="flex:1;text-align:center;background:#e8f5e9;color:#2e7d32;border-radius:5px;padding:6px;text-decoration:none;font-size:11.5px;font-weight:700">🗺 Maps</a>'+
        '<a href="https://waze.com/ul?ll='+co[1]+','+co[0]+'&navigate=yes" target="_blank" rel="noopener" style="flex:1;text-align:center;background:#e3f2fd;color:#1565c0;border-radius:5px;padding:6px;text-decoration:none;font-size:11.5px;font-weight:700">🚗 Waze</a>'+
        '</div>';
      html+='</div>';
    });
  }else{html+='<div style="padding:8px;color:#aaa">Accès : données non chargées</div>';}

  if(npams.length){
    npams.forEach(function(npam,i){
      var p=npam.f.props,co=npam.f.geom.coordinates;
      html+='<div style="padding:10px;background:#f3e5f5;border-radius:8px;border-left:4px solid #9c27b0">';
      html+='<div style="font-size:11px;color:#888;font-weight:600;text-transform:uppercase;margin-bottom:4px">'+(i===0?'PAM la plus proche':'PAM #'+(i+1))+'</div>';
      html+='<div style="font-size:15px;font-weight:700;color:#9c27b0">🌱 '+c(p.libelle||'PAM')+'</div>';
      if(p.axe)html+='<div style="font-size:12px;color:#555">Axe : '+c(p.axe)+'</div>';
      html+='<div style="font-size:13px;font-weight:600;margin-top:4px">'+_dStr(npam.d)+'</div>';
      html+=zoomBtn(co,16,'→ Zoom sur cette PAM');
      html+='<div style="display:flex;gap:6px;margin-top:6px">'+
        '<a href="https://www.google.com/maps/dir/?api=1&destination='+co[1]+','+co[0]+'" target="_blank" rel="noopener" style="flex:1;text-align:center;background:#e8f5e9;color:#2e7d32;border-radius:5px;padding:6px;text-decoration:none;font-size:11.5px;font-weight:700">🗺 Maps</a>'+
        '<a href="https://waze.com/ul?ll='+co[1]+','+co[0]+'&navigate=yes" target="_blank" rel="noopener" style="flex:1;text-align:center;background:#e3f2fd;color:#1565c0;border-radius:5px;padding:6px;text-decoration:none;font-size:11.5px;font-weight:700">🚗 Waze</a>'+
        '</div>';
      html+='</div>';
    });
  }else{html+='<div style="padding:8px;color:#aaa">PAM : données non chargées</div>';}

  html+='</div>';
  openDetail('📍 Éléments LGV proches',html);
}

/* ══════════════════════════════════════════════════════════
   RECHERCHE
   ══════════════════════════════════════════════════════════ */
function _initSearch(){
  var inp=document.getElementById('search-input');
  var res=document.getElementById('search-res');
  var timer;
  inp.addEventListener('input',function(){
    clearTimeout(timer);
    var q=inp.value.trim();
    if(q.length<2){res.style.display='none';return;}
    timer=setTimeout(function(){
      var ql=q.toLowerCase().replace(/\s*\+\s*/g,'+');
      var hits=searchIndex.filter(function(x){
        return x.label.toLowerCase().replace(/\s*\+\s*/g,'+').includes(ql)||
               (x.sub||'').toLowerCase().replace(/\s*\+\s*/g,'+').includes(ql);
      });
      hits=hits.slice(0,12);
      if(!hits.length){res.style.display='none';return;}
      res.innerHTML=hits.map(function(h,i){
        return'<div class="sr-item" onclick="goToResult('+i+')">'+
          '<span class="sr-badge">'+h.type+'</span>'+
          '<span><b>'+esc(h.label)+'</b>'+(h.sub?'<br><small style="color:#888">'+esc(h.sub)+'</small>':'')+'</span></div>';
      }).join('');
      res._hits=hits;res.style.display='block';
    },180);
  });
  inp.addEventListener('keydown',function(e){if(e.key==='Escape')res.style.display='none';});
  document.addEventListener('click',function(e){if(!e.target.closest('#search-wrap'))res.style.display='none';});
}
function goToResult(idx){
  var hits=document.getElementById('search-res')._hits||[];
  var h=hits[idx];if(!h||!h.geom)return;
  if(window._forceLayerOn)window._forceLayerOn(h.type);
  var isPoint=(h.geom.type==='Point'||h.geom.type==='MultiPoint');
  focusGeom(h.geom,{zoom:isPoint?18:undefined,maxZoom:19});
  if(h.props)setTimeout(function(){_openDetailFromSearch(h);},300);
  document.getElementById('search-res').style.display='none';
  document.getElementById('search-input').value=h.label;
}
function _openDetailFromSearch(h){
  if(!h.props)return;
  if(h.type==='OA')openDetailOA(h.props);
  else if(h.type==='OH')openDetailOH(h.props);
  else if(h.type==='PAM')openDetailPAM(h.props);
  else if(h.type==='Accès')openDetailAcces(h.props);
}
var _pkLoaded=false;
function addPKtoIndex(fc){
  if(_pkLoaded)return;_pkLoaded=true;
  (fc.features||[]).forEach(function(f){
    searchIndex.push({type:'PK',label:c(f.properties._pk_label||f.properties.Name),
      sub:c(f.properties._voie||''),geom:f.geometry});
  });
}
function addPKHectoToIndex(fc){
  if(_pkHLoaded||!fc)return;_pkHLoaded=true;
  (fc.features||[]).forEach(function(f){
    searchIndex.push({type:'PK',label:c(f.properties._pk_label||f.properties.Name),
      sub:c(f.properties._voie||''),geom:f.geometry});
  });
}
var _bsiTimer=null;
function _debounceBSI(){clearTimeout(_bsiTimer);_bsiTimer=setTimeout(buildSearchIndex,250);}
function buildSearchIndex(){
  searchIndex=searchIndex.filter(function(x){return x.type==='PK';});
  layerData.oa.forEach(function(f){var p=f.props;
    searchIndex.push({type:'OA',label:c(p.CODE_OBJET)+' – '+c(p.LIBELLE_LO),sub:c(p._pk_fmt),geom:f.geom,props:p});});
  layerData.oh.forEach(function(f){var p=f.props;
    searchIndex.push({type:'OH',label:c(p.code_objet)+' – '+c(p.libelle_ob),sub:c(p._pk_fmt),geom:f.geom,props:p});});
  layerData.acces.forEach(function(f){var p=f.props;
    searchIndex.push({type:'Accès',label:c(p.NOM_ACCES||p.Name||''),
      sub:c(p.AXE)+' PK '+c(p.PK),geom:f.geom,props:p});});
  layerData.pam.forEach(function(f){var p=f.props;
    searchIndex.push({type:'PAM',label:c(p.libelle||'PAM'),
      sub:[c(p.axe),c(p.pk_ef||p.pk_gc)].filter(Boolean).join(' • '),geom:f.geom,props:p});});
}

var _tblOpen=false,_tblSortCol=null,_tblSortAsc=true;
function toggleTable(){_tblOpen=!_tblOpen;document.getElementById('tbl-panel').classList.toggle('open',_tblOpen);if(_tblOpen)fillTable();}
function refreshTableIfOpen(){if(_tblOpen)fillTable();}
function closeTable(){_tblOpen=false;document.getElementById('tbl-panel').classList.remove('open');}
function fillTable(){
  var lyr=document.getElementById('tbl-layer-sel').value;
  var data=layerData[lyr]||[];
  var filter=(document.getElementById('tbl-filter').value||'').toLowerCase();
  if(filter)data=data.filter(function(f){return JSON.stringify(f.props).toLowerCase().includes(filter);});
  if(!data.length){
    document.getElementById('tbl-scroll').innerHTML=(_loading[lyr])
      ?'<p style="padding:12px;color:#888">⏳ Chargement…</p>'
      :'<p style="padding:12px;color:#aaa">Aucune donnée.</p>';return;}
  var skip=['_ph_b64','_ph_path','_ph_url'];
  var cols=Object.keys(data[0].props).filter(function(k){return!skip.includes(k);}).slice(0,12);
  if(_tblSortCol)data=data.slice().sort(function(a,b){
    var va=c(a.props[_tblSortCol]),vb=c(b.props[_tblSortCol]);
    return _tblSortAsc?va.localeCompare(vb,undefined,{numeric:true}):vb.localeCompare(va,undefined,{numeric:true});
  });
  var html='<table><thead><tr><th>🔍</th>';
  cols.forEach(function(k){html+='<th onclick="sortTable(\''+k+'\')" title="Trier">'+k+(_tblSortCol===k?(_tblSortAsc?' ↑':' ↓'):'')+'</th>';});
  html+='</tr></thead><tbody>';
  data.forEach(function(f,i){
    html+='<tr><td><button class="tbl-zoom" onclick="zoomToTblFeature('+i+')">🔍</button></td>';
    cols.forEach(function(k){html+='<td title="'+esc(c(f.props[k]))+'">'+esc(c(f.props[k]))+'</td>';});
    html+='</tr>';
  });
  html+='</tbody></table>';
  document.getElementById('tbl-scroll').innerHTML=html;
  document.getElementById('tbl-scroll')._data=data;
}
function sortTable(col){if(_tblSortCol===col)_tblSortAsc=!_tblSortAsc;else{_tblSortCol=col;_tblSortAsc=true;}fillTable();}
function filterTable(){fillTable();}
function zoomToTblFeature(idx){
  var data=(document.getElementById('tbl-scroll')._data)||[];
  var f=data[idx];if(!f||!f.geom)return;
  var isPoint=(f.geom.type==='Point'||f.geom.type==='MultiPoint');
  focusGeom(f.geom,{zoom:isPoint?18:undefined,maxZoom:19});
  var lyr=document.getElementById('tbl-layer-sel').value;

    var h={type:lyr==='oa'?'OA':lyr==='oh'?'OH':lyr==='pam'?'PAM':'Accès',label:'',props:f.props,geom:f.geom};

function getPJList(code){try{return JSON.parse(localStorage.getItem('pj_'+code)||'[]');}catch(e){return[];}}
function savePJList(code,list){try{localStorage.setItem('pj_'+code,JSON.stringify(list));}catch(e){}}
function _dpjItems(code){
  var list=getPJList(code);
  return list.length?list.map(function(p,i){
    var d='';try{d=new Date(p.date).toLocaleDateString('fr-FR');}catch(e){}
    return'<div class="dpj-item"><a href="'+p.data+'" download="'+esc(p.name)+'">📄 '+esc(p.name)+'</a>'+
      '<span class="dpj-date">'+d+'</span>'+
      '<button class="pj-del" onclick="dpjDel(\''+esc(code)+'\','+i+')">✕</button></div>';
  }).join(''):'<div class="dpj-empty">Aucune pièce jointe</div>';
}
function dpPJWrap(code){
  var sc=esc(code),cnt=getPJList(code).length;
  return'<div class="dpj"><div class="dpj-hd"><span class="dpj-lbl">📎 Pièces jointes</span>'+
    '<span class="dpj-cnt" id="dpj-cnt-'+sc+'">'+cnt+'</span></div>'+
    '<div id="dpj-'+sc+'">'+_dpjItems(code)+'</div>'+
    '<label class="dpj-add">➕ Ajouter<input type="file" multiple style="display:none" onchange="dpjAdd(\''+sc+'\',this)"/></label></div>';
}
function dpjDel(code,idx){
  var list=getPJList(code);list.splice(idx,1);savePJList(code,list);
  var el=document.getElementById('dpj-'+code);if(el)el.innerHTML=_dpjItems(code);
  var cnt=document.getElementById('dpj-cnt-'+code);if(cnt)cnt.textContent=list.length;
}
function dpjAdd(code,input){
  var files=Array.from(input.files),list=getPJList(code),toRead=files.length;
  files.forEach(function(file){
    var reader=new FileReader();
    reader.onload=function(e){
      list.push({name:file.name,data:e.target.result,type:file.type,date:new Date().toISOString()});
      toRead--;if(!toRead){savePJList(code,list);
        var el=document.getElementById('dpj-'+code);if(el)el.innerHTML=_dpjItems(code);
        var cnt=document.getElementById('dpj-cnt-'+code);if(cnt)cnt.textContent=list.length;}
    };reader.readAsDataURL(file);
  });input.value='';
}

   KML / KMZ
   ══════════════════════════════════════════════════════════ */
var _kmlLayers={},_kmlPending=null,_kmlIdx=0;
function importKML(input){
  var file=input.files[0];if(!file)return;
  _kmlPending={file:file};input.value='';
  document.getElementById('kml-choice-fname').textContent=file.name;
  document.getElementById('kml-choice-modal').classList.add('open');
}
function cancelKML(){document.getElementById('kml-choice-modal').classList.remove('open');_kmlPending=null;}
function confirmKML(store){
  document.getElementById('kml-choice-modal').classList.remove('open');
  if(!_kmlPending)return;
  var file=_kmlPending.file;_kmlPending=null;
  function addKMLLayer(geojson,fname){
    var lname='📎 '+fname;
    var sid='kml-'+(++_kmlIdx);
    map.addSource(sid,{type:'geojson',data:geojson});
    var ids=[];
    map.addLayer({id:sid+'-fill',type:'fill',source:sid,
      filter:['==',['geometry-type'],'Polygon'],
      paint:{'fill-color':'#f44336','fill-opacity':0.28}});
    ids.push(sid+'-fill');
    map.addLayer({id:sid+'-line',type:'line',source:sid,
      paint:{'line-color':'#f44336','line-width':2}});
    ids.push(sid+'-line');
    map.addLayer({id:sid+'-pt',type:'circle',source:sid,
      filter:['==',['geometry-type'],'Point'],
      paint:{'circle-radius':7,'circle-color':'#f44336','circle-stroke-width':2,'circle-stroke-color':'white'}});
    ids.push(sid+'-pt');
    map.on('click',sid+'-pt',function(e){
      var p=e.features[0].properties;
      new maplibregl.Popup().setLngLat(e.lngLat)
        .setHTML('<div class="mlpop"><h3>'+esc(c(p.name||'KML'))+'</h3>'+(p.description?'<p style="font-size:12px">'+esc(p.description)+'</p>':'')+'</div>')
        .addTo(map);
    });
    map.on('mouseenter',sid+'-pt',function(){map.getCanvas().style.cursor='pointer';});
    map.on('mouseleave',sid+'-pt',function(){map.getCanvas().style.cursor='';});
    _kmlLayers[lname]={sourceId:sid,layerIds:ids};
    try{var b=new maplibregl.LngLatBounds();
      (geojson.features||[]).forEach(function(f){
        if(!f.geometry)return;
        function ext(a){if(typeof a[0]==='number')b.extend([a[0],a[1]]);else a.forEach(ext);}
        if(f.geometry.coordinates)ext(f.geometry.coordinates);
      });
      if(!b.isEmpty())map.fitBounds(b,{padding:40});}catch(e2){}
    if(store){try{var stored=JSON.parse(localStorage.getItem('kml_layers')||'[]');
      stored.push({name:lname,geojson:JSON.stringify(geojson)});
      localStorage.setItem('kml_layers',JSON.stringify(stored));}catch(e2){}}
    refreshKMLSection();
  }
  function processKML(kmlStr,fname){
    try{var doc=new DOMParser().parseFromString(kmlStr,'text/xml');
      var conv=window.toGeoJSON||window.togeojson;
      if(!conv||!conv.kml){alert('toGeoJSON non disponible');return;}
      addKMLLayer(conv.kml(doc),fname);}
    catch(e){alert('Erreur KML : '+e.message);}
  }
  if(file.name.toLowerCase().endsWith('.kmz')){
    var r=new FileReader();r.onload=function(ev){
      if(typeof JSZip==='undefined'){alert('JSZip non chargé');return;}
      JSZip.loadAsync(ev.target.result).then(function(zip){
        var kf=null;zip.forEach(function(p,zf){if(!kf&&p.toLowerCase().endsWith('.kml'))kf=zf;});
        if(!kf){alert('Aucun .kml dans ce KMZ');return;}
        kf.async('string').then(function(s){processKML(s,file.name);});
      }).catch(function(e){alert('Erreur KMZ : '+e.message);});
    };r.readAsArrayBuffer(file);
  } else {
    var r2=new FileReader();r2.onload=function(ev){processKML(ev.target.result,file.name);};r2.readAsText(file);
  }
}
function removeKMLLayer(name){
  var lyr=_kmlLayers[name];if(!lyr)return;
  lyr.layerIds.forEach(function(id){if(map.getLayer(id))map.removeLayer(id);});
  if(map.getSource(lyr.sourceId))map.removeSource(lyr.sourceId);
  delete _kmlLayers[name];
  try{var stored=JSON.parse(localStorage.getItem('kml_layers')||'[]');
    stored=stored.filter(function(s){return s.name!==name;});
    localStorage.setItem('kml_layers',JSON.stringify(stored));}catch(e){}
  refreshKMLSection();
}
function refreshKMLSection(){
  var sec=document.getElementById('kml-layers-section');if(!sec)return;
  var names=Object.keys(_kmlLayers);
  if(!names.length){sec.innerHTML='';return;}
  sec.innerHTML='<div style="font-size:10px;font-weight:700;color:#888;margin:10px 0 4px;border-top:1px solid #eee;padding-top:8px;display:flex;align-items:center">KML IMPORTÉS<button onclick="Object.keys(_kmlLayers).slice().forEach(removeKMLLayer)" style="margin-left:auto;background:#ffebee;border:1px solid #ef9a9a;border-radius:3px;padding:2px 7px;cursor:pointer;color:#c62828;font-size:10px;font-weight:700">🗑 Tout</button></div>';
  names.forEach(function(name){
    var div=document.createElement('div');div.className='lp-item';
    div.innerHTML='<span style="font-size:12px;flex-shrink:0">📎</span>'+
      '<span style="flex:1;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+
      esc(name.replace(/^📎\s*/,''))+'</span>';
    var btn=document.createElement('button');btn.className='kml-del';btn.textContent='✕';btn.title='Supprimer';
    (function(n){btn.addEventListener('click',function(){removeKMLLayer(n);});})(name);
    div.appendChild(btn);sec.appendChild(div);
  });
}
function _restoreKMLLayers(){
  try{var stored=JSON.parse(localStorage.getItem('kml_layers')||'[]');
    stored.forEach(function(s){
      try{confirmKMLDirect(JSON.parse(s.geojson),s.name.replace(/^📎\s*/,''));}catch(e2){}
    });refreshKMLSection();}catch(e){}
}
function confirmKMLDirect(geojson,fname){
  var lname='📎 '+fname,sid='kml-'+(++_kmlIdx);
  if(!map.loaded()){map.once('idle',function(){confirmKMLDirect(geojson,fname);});return;}
  try{map.addSource(sid,{type:'geojson',data:geojson});
    var ids=[];
    map.addLayer({id:sid+'-fill',type:'fill',source:sid,filter:['==',['geometry-type'],'Polygon'],paint:{'fill-color':'#f44336','fill-opacity':0.28}});ids.push(sid+'-fill');
    map.addLayer({id:sid+'-line',type:'line',source:sid,paint:{'line-color':'#f44336','line-width':2}});ids.push(sid+'-line');
    map.addLayer({id:sid+'-pt',type:'circle',source:sid,filter:['==',['geometry-type'],'Point'],paint:{'circle-radius':7,'circle-color':'#f44336','circle-stroke-width':2,'circle-stroke-color':'white'}});ids.push(sid+'-pt');
    _kmlLayers[lname]={sourceId:sid,layerIds:ids};}catch(e){}
}

  if(btn){btn.textContent='⏳';btn.disabled=true;btn.dataset.state='';}
  var files=[
    'data/rail.geojson','data/pk.geojson','data/pk_hecto.geojson',
    'data/oa.geojson','data/oh.geojson','data/pam.geojson','data/acces.geojson','data/oa_poly.geojson',
    'data/pk_metric.pmtiles',
    'data/n2.geojson','data/old.geojson','data/mc.geojson','data/eco.geojson',
    'manifest.json','icons/icon-192.png','icons/icon-512.png'
  ];
  var done=0;
  for(var i=0;i<files.length;i+=4){
    await Promise.all(files.slice(i,i+4).map(function(f){
      return fetch(f).then(function(){done++;if(btn)btn.title='Données: '+done+'/'+files.length;}).catch(function(){done++;});
    }));
  }
  var BB={x0:-1.1,x1:1.1,y0:44.4,y1:47.6};
  function tX(lng,z){return Math.floor((lng+180)/360*Math.pow(2,z));}
  function tY(lat,z){var r=lat*Math.PI/180;var n=Math.pow(2,z);return Math.floor(n*(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2);}
  var tiles=[];
  var TPL='https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/jpeg&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}';
  for(var z=5;z<=11;z++){
    var xa=tX(BB.x0,z),xb=tX(BB.x1,z),ya=tY(BB.y1,z),yb=tY(BB.y0,z);
    for(var x=xa;x<=xb;x++)for(var y=ya;y<=yb;y++)
      tiles.push(TPL.replace('{z}',z).replace('{x}',x).replace('{y}',y));
  }
  if(btn)btn.title='🗺 Tuiles: 0/'+tiles.length;
  var td=0;
  for(var i=0;i<tiles.length;i+=8){
    await Promise.all(tiles.slice(i,i+8).map(function(u){
      return fetch(u).then(function(){td++;if(btn)btn.title='🗺 Tuiles: '+td+'/'+tiles.length;}).catch(function(){td++;});
    }));
  }
  try{localStorage.setItem('lgv_cached_v4','1');}catch(e){}
  if(btn){btn.textContent='✅';btn.title='Carte offline ✓';}
  showNetToast('✅ Carte disponible hors-ligne');
  setTimeout(function(){if(btn){btn.textContent='📶';btn.disabled=false;}updateNetBadge();},3000);
}
window.warmOfflineCache=warmOfflineCache;

/* Alias globaux attendus par les onclick inline */
window.toggleLayersPanel=window.toggleLayersPanel||function(){document.getElementById('layers-panel').classList.toggle('open');};
window.closeDetail=closeDetail;
window.toggleTable=toggleTable;
window.closeTable=closeTable;
window.fillTable=fillTable;
window.filterTable=filterTable;
window.sortTable=sortTable;
window.zoomToTblFeature=zoomToTblFeature;
window.importKML=importKML;
window.cancelKML=cancelKML;
window.confirmKML=confirmKML;
window.removeKMLLayer=removeKMLLayer;
window.toggleFabBar=toggleFabBar;
window.switchBM=window.switchBM;
</script>
