<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Réinitialisation cache – Carte LGV</title>
<style>
  body{font-family:sans-serif;display:flex;flex-direction:column;align-items:center;
       justify-content:center;min-height:100vh;margin:0;background:#1a237e;color:#fff;text-align:center;padding:20px;}
  h1{font-size:1.4em;margin-bottom:8px;}
  p{opacity:.85;margin:4px 0;}
  .spinner{width:48px;height:48px;border:5px solid rgba(255,255,255,.3);
           border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;margin:20px auto;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .done{background:#1b5e20;border-radius:8px;padding:12px 24px;margin-top:12px;}
  a{color:#80cbc4;font-weight:bold;}
</style>
</head>
<body>
<h1>🔄 Réinitialisation en cours…</h1>
<p>Suppression du cache et du Service Worker</p>
<div class="spinner" id="spin"></div>
<div id="msg"></div>
<script>
(async function(){
  var msg = document.getElementById('msg');
  var steps = [];

  // 1. Désinscription de tous les Service Workers
  if ('serviceWorker' in navigator) {
    try {
      var regs = await navigator.serviceWorker.getRegistrations();
      for (var r of regs) { await r.unregister(); }
      steps.push('✓ Service Worker(s) désinscrit(s) : ' + regs.length);
    } catch(e) { steps.push('⚠ SW : ' + e.message); }
  } else {
    steps.push('ℹ Service Worker non supporté');
  }

  // 2. Suppression de tous les caches
  if ('caches' in window) {
    try {
      var keys = await caches.keys();
      for (var k of keys) { await caches.delete(k); }
      steps.push('✓ Caches supprimés : ' + keys.length + ' (' + keys.join(', ') + ')');
    } catch(e) { steps.push('⚠ Cache : ' + e.message); }
  }

  // 3. Nettoyage localStorage préférences couches
  try {
    var removed = [];
    for (var i = localStorage.length - 1; i >= 0; i--) {
      var key = localStorage.key(i);
      if (key && key.startsWith('lgv_')) { localStorage.removeItem(key); removed.push(key); }
    }
    steps.push('✓ localStorage nettoyé : ' + (removed.length ? removed.join(', ') : 'rien à supprimer'));
  } catch(e) { steps.push('⚠ localStorage : ' + e.message); }

  // Affichage résultat
  document.getElementById('spin').style.display = 'none';
  msg.innerHTML = '<div class="done">' +
    steps.map(function(s){return '<p>'+s+'</p>';}).join('') +
    '<p style="margin-top:12px;font-size:1.1em">✅ Terminé !</p>' +
    '<p style="margin-top:16px"><a href="./">→ Ouvrir la carte (version fraîche)</a></p>' +
    '</div>';
})();
</script>
</body>
</html>
