name: Publish LGV Dashboard

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    # Toutes les heures à la minute 15
    - cron: "15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "lgv-dashboard-pages"
  cancel-in-progress: false

jobs:
  build:
    name: Collecte et génération
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ============================================================
      # 1. Récupération du dépôt
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. Installation de Python
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ============================================================
      # 3. Installation des dépendances
      # ============================================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

          echo "Version Python :"
          python --version

          echo "Version pip :"
          python -m pip --version

      # ============================================================
      # 4. Préparation des dossiers
      # ============================================================

      - name: Prepare directories
        run: |
          set -euo pipefail

          mkdir -p data
          mkdir -p reports
          mkdir -p site
          mkdir -p site/dashboard/reports
          mkdir -p site/reports

          echo "Dossiers préparés."

      # ============================================================
      # 5. Collecte des données hydro-météorologiques
      # ============================================================

      - name: Collect monitoring data
        run: |
          set -euo pipefail

          echo "Démarrage de la collecte LGV SEA..."

          python run_collection.py \
            --once \
            --max-distance-km 25

          echo "Collecte terminée."

      # ============================================================
      # 6. Génération du dashboard et du snapshot Streamlit
      # ============================================================

      - name: Generate dashboard and Streamlit snapshot
        run: |
          set -euo pipefail

          echo "Génération du dashboard LGV SEA..."

          python run_once_dashboard.py

          echo "Génération terminée."

      # ============================================================
      # 7. Vérification des fichiers générés
      # ============================================================

      - name: Check generated files
        run: |
          set -euo pipefail

          if [ ! -f "reports/lgv_dashboard_latest.html" ]; then
            echo "::error::Le fichier reports/lgv_dashboard_latest.html est absent."
            exit 1
          fi

          if [ ! -s "reports/lgv_dashboard_latest.html" ]; then
            echo "::error::Le fichier reports/lgv_dashboard_latest.html est vide."
            exit 1
          fi

          if [ ! -f "reports/streamlit_snapshot_latest.json" ]; then
            echo "::error::Le fichier reports/streamlit_snapshot_latest.json est absent."
            exit 1
          fi

          if [ ! -s "reports/streamlit_snapshot_latest.json" ]; then
            echo "::error::Le fichier reports/streamlit_snapshot_latest.json est vide."
            exit 1
          fi

          echo "Fichiers générés :"
          ls -lh reports/

      # ============================================================
      # 8. Validation du snapshot Streamlit
      # ============================================================

      - name: Validate Streamlit snapshot
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import sys

          from datetime import datetime, timezone
          from pathlib import Path


          SNAPSHOT_PATH = Path(
              "reports/streamlit_snapshot_latest.json"
          )

          MAX_SNAPSHOT_AGE_HOURS = 3.0


          def fail(message: str) -> None:
              print(f"::error::{message}")
              sys.exit(1)


          if not SNAPSHOT_PATH.exists():
              fail(
                  "Le snapshot Streamlit est absent : "
                  f"{SNAPSHOT_PATH}"
              )

          if SNAPSHOT_PATH.stat().st_size == 0:
              fail("Le snapshot Streamlit est vide.")

          try:
              with SNAPSHOT_PATH.open(
                  "r",
                  encoding="utf-8",
              ) as file:
                  snapshot = json.load(file)

          except json.JSONDecodeError as error:
              fail(
                  "Le snapshot n'est pas un JSON valide : "
                  f"{error}"
              )

          except OSError as error:
              fail(
                  "Impossible de lire le snapshot : "
                  f"{error}"
              )

          if not isinstance(snapshot, dict):
              fail(
                  "La racine du snapshot doit être un objet JSON."
              )

          if not snapshot:
              fail(
                  "Le snapshot contient uniquement un objet vide."
              )

          timestamp = (
              snapshot.get("timestamp_utc")
              or snapshot.get("generated_at_utc")
          )

          if not timestamp:
              fail(
                  "Le snapshot ne contient ni timestamp_utc "
                  "ni generated_at_utc."
              )

          try:
              snapshot_datetime = datetime.fromisoformat(
                  str(timestamp).replace("Z", "+00:00")
              )

          except ValueError as error:
              fail(
                  "Le timestamp du snapshot est invalide : "
                  f"{error}"
              )

          if snapshot_datetime.tzinfo is None:
              snapshot_datetime = snapshot_datetime.replace(
                  tzinfo=timezone.utc
              )

          snapshot_datetime = snapshot_datetime.astimezone(
              timezone.utc
          )

          now_utc = datetime.now(timezone.utc)

          age_hours = (
              now_utc - snapshot_datetime
          ).total_seconds() / 3600

          print("=" * 60)
          print("VALIDATION DU SNAPSHOT LGV SEA")
          print("=" * 60)
          print(f"Fichier       : {SNAPSHOT_PATH}")
          print(f"Taille        : {SNAPSHOT_PATH.stat().st_size} octets")
          print(f"Date actuelle : {now_utc.isoformat()}")
          print(f"Date snapshot : {snapshot_datetime.isoformat()}")
          print(f"Âge snapshot  : {age_hours:.2f} heure(s)")
          print("=" * 60)

          if age_hours < -1:
              fail(
                  "Le timestamp du snapshot est situé dans le futur."
              )

          if age_hours > MAX_SNAPSHOT_AGE_HOURS:
              fail(
                  "Le snapshot est trop ancien. "
                  f"Âge constaté : {age_hours:.2f} heure(s). "
                  f"Âge maximal autorisé : "
                  f"{MAX_SNAPSHOT_AGE_HOURS:.2f} heure(s)."
              )

          sectors_payload = snapshot.get("sectors")

          if not sectors_payload:
              print(
                  "::warning::Le snapshot ne contient pas "
                  "de données dans la clé sectors."
              )

          elif isinstance(sectors_payload, dict):
              sectors = sectors_payload.get("sectors", [])

              if not sectors:
                  print(
                      "::warning::La liste des secteurs est vide."
                  )
              else:
                  print(
                      f"Nombre de secteurs : {len(sectors)}"
                  )

          print("Snapshot récent et valide.")
          PY

      # ============================================================
      # 9. Récupération du site GitHub Pages existant
      # ============================================================

      - name: Fetch existing GitHub Pages content
        run: |
          set -euo pipefail

          if git ls-remote \
            --exit-code \
            --heads origin gh-pages \
            > /dev/null 2>&1
          then
            echo "Récupération de la branche gh-pages..."

            git fetch origin gh-pages

            git archive origin/gh-pages \
              | tar -x -C site/

            echo "Contenu existant de gh-pages récupéré."
          else
            echo "La branche gh-pages n'existe pas."
            echo "Un nouveau contenu GitHub Pages sera créé."
          fi

      # ============================================================
      # 10. Copie du dashboard et du snapshot
      # ============================================================

      - name: Add dashboard and snapshot to Pages site
        run: |
          set -euo pipefail

          mkdir -p site/dashboard/reports
          mkdir -p site/reports

          cp \
            reports/lgv_dashboard_latest.html \
            site/dashboard/index.html

          cp \
            reports/lgv_dashboard_latest.html \
            site/dashboard/reports/lgv_dashboard_latest.html

          cp \
            reports/streamlit_snapshot_latest.json \
            site/dashboard/reports/streamlit_snapshot_latest.json

          cp \
            reports/streamlit_snapshot_latest.json \
            site/reports/streamlit_snapshot_latest.json

          echo "Dashboard et snapshot copiés dans le site."

      # ============================================================
      # 11. Vérification de la copie du snapshot
      # ============================================================

      - name: Verify copied snapshot
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import sys

          from pathlib import Path


          SOURCE_PATH = Path(
              "reports/streamlit_snapshot_latest.json"
          )

          PUBLISHED_PATH = Path(
              "site/reports/streamlit_snapshot_latest.json"
          )


          def fail(message: str) -> None:
              print(f"::error::{message}")
              sys.exit(1)


          if not SOURCE_PATH.exists():
              fail(
                  "Le snapshot source est absent : "
                  f"{SOURCE_PATH}"
              )

          if not PUBLISHED_PATH.exists():
              fail(
                  "Le snapshot destiné à la publication est absent : "
                  f"{PUBLISHED_PATH}"
              )

          try:
              with SOURCE_PATH.open(
                  "r",
                  encoding="utf-8",
              ) as file:
                  source_snapshot = json.load(file)

              with PUBLISHED_PATH.open(
                  "r",
                  encoding="utf-8",
              ) as file:
                  published_snapshot = json.load(file)

          except Exception as error:
              fail(
                  "Impossible de comparer les snapshots : "
                  f"{error}"
              )

          source_timestamp = (
              source_snapshot.get("timestamp_utc")
              or source_snapshot.get("generated_at_utc")
          )

          published_timestamp = (
              published_snapshot.get("timestamp_utc")
              or published_snapshot.get("generated_at_utc")
          )

          print(f"Timestamp source  : {source_timestamp}")
          print(f"Timestamp publié : {published_timestamp}")

          if source_timestamp != published_timestamp:
              fail(
                  "Le timestamp du snapshot publié ne correspond "
                  "pas au snapshot généré."
              )

          if source_snapshot != published_snapshot:
              fail(
                  "Le contenu du snapshot publié ne correspond pas "
                  "au snapshot généré."
              )

          print("La copie du snapshot est conforme.")
          PY

      # ============================================================
      # 12. Résumé des fichiers à publier
      # ============================================================

      - name: Display publication summary
        run: |
          set -euo pipefail

          echo "Contenu du site à publier :"

          find site \
            -maxdepth 4 \
            -type f \
            -printf "%p | %s octets\n" \
            | sort

      # ============================================================
      # 13. Configuration de GitHub Pages
      # ============================================================

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # ============================================================
      # 14. Création de l'artefact GitHub Pages
      # ============================================================

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Déploiement GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ============================================================
      # 15. Déploiement
      # ============================================================

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ============================================================
      # 16. Réveil de l'application Streamlit
      # ============================================================

      - name: Wake Streamlit monitoring application
        env:
          STREAMLIT_APP_URL: "https://lgv-sea-monitoring-meteo-gc.streamlit.app/"
        run: |
          set +e

          echo "Attente de la propagation GitHub Pages..."
          sleep 30

          echo "Réveil de l'application Streamlit :"
          echo "$STREAMLIT_APP_URL"

          HTTP_CODE="$(
            curl \
              --location \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              --max-time 120 \
              --retry 2 \
              --retry-delay 10 \
              "$STREAMLIT_APP_URL"
          )"

          CURL_STATUS=$?

          echo "Code HTTP Streamlit : $HTTP_CODE"

          if [ "$CURL_STATUS" -ne 0 ]; then
            echo "::warning::La requête vers Streamlit a échoué."
          elif [ "$HTTP_CODE" -ge 400 ]; then
            echo "::warning::Streamlit a répondu avec le code HTTP $HTTP_CODE."
          else
            echo "Application Streamlit réveillée avec succès."
          fi

          exit 0
