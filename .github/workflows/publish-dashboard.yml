name: Publish LGV Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"
  push:
    branches: [main]
    paths:
      - "run_once_dashboard.py"
      - "meteo_test.py"
      - "requirements.txt"
      - ".github/workflows/publish-dashboard.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lgv-dashboard-pages
  cancel-in-progress: false  # ← CHANGE: false au lieu de true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore current published site
        run: |
          set -euo pipefail
          mkdir -p site reports
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git archive origin/gh-pages | tar -x -C site/ || true
          fi
          if [ -f site/reports/streamlit_snapshot_latest.json ]; then
            cp site/reports/streamlit_snapshot_latest.json reports/streamlit_snapshot_last_valid.json || true
          elif [ -f site/dashboard/reports/streamlit_snapshot_latest.json ]; then
            cp site/dashboard/reports/streamlit_snapshot_latest.json reports/streamlit_snapshot_last_valid.json || true
          fi

      - name: Generate dashboard and snapshot
        env:
          LGV_MAX_CYCLE_SECONDS: "600"
          LGV_WEATHER_CORRIDOR_KM: "15"
          LGV_SYNOP_CACHE_TTL_HOURS: "6"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python run_once_dashboard.py || (echo "First attempt failed, retrying..." && sleep 20 && python run_once_dashboard.py)

      - name: Validate generated files
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          html_path = Path("reports/lgv_dashboard_latest.html")
          json_path = Path("reports/streamlit_snapshot_latest.json")
          
          if not html_path.is_file() or html_path.stat().st_size < 500:
              print("❌ Dashboard HTML absent ou anormalement petit")
              exit(1)
          if not json_path.is_file() or json_path.stat().st_size < 100:
              print("❌ Snapshot JSON absent ou anormalement petit")
              exit(1)

          with json_path.open(encoding="utf-8") as handle:
              snapshot = json.load(handle)

          container = snapshot.get("sectors")
          sectors = container.get("sectors", []) if isinstance(container, dict) else container
          if not isinstance(sectors, list) or not sectors:
              print("❌ Snapshot refusé : aucun secteur")
              exit(1)

          print(f"✅ Snapshot valide : {len(sectors)} secteurs")
          PY

      - name: Publish validated files into site
        run: |
          set -euo pipefail
          mkdir -p site/dashboard/reports site/reports
          cp reports/lgv_dashboard_latest.html site/dashboard/index.html
          cp reports/lgv_dashboard_latest.html site/dashboard/reports/lgv_dashboard_latest.html
          cp reports/streamlit_snapshot_latest.json site/dashboard/reports/streamlit_snapshot_latest.json
          cp reports/streamlit_snapshot_latest.json site/reports/streamlit_snapshot_latest.json

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
