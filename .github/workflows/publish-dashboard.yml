      - name: Validate Stre*mlit snapshot
        run: |
     *    set -euo pipefail

          p*thon - <<'PY'
          import jso*
          import sys

          f*om datetime import datetime, timez*ne
          from pathlib import P*th


          SNAPSHOT_PATH = Pat*(
