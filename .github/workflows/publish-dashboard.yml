      # ============================================================
      # 11. Récupération du contenu GitHub Pages existant
      # ============================================================

      - name: Fetch existing GitHub Pages content
        run: |
          set -euo pipefail

          if git ls-remote \
            --exit-code \
            --heads origin gh-pages \
            > /dev/null 2>&1
          then
            echo "Récupération de la branche gh-pages..."

            git fetch origin gh-pages

            git archive origin/gh-pages \
              | tar -x -C site/

            echo "Contenu existant de gh-pages récupéré."
          else
            echo "La branche gh-pages n'existe pas."
            echo "Un nouveau contenu GitHub Pages sera créé."
          fi

      # ============================================================
      # 12. Copie du dashboard et du snapshot dans le site
      # ============================================================

      - name: Add dashboard and snapshot to Pages site
        run: |
          set -euo pipefail

          mkdir -p site/dashboard/reports
          mkdir -p site/reports

          cp \
            reports/lgv_dashboard_latest.html \
            site/dashboard/index.html

          cp \
            reports/lgv_dashboard_latest.html \
            site/dashboard/reports/lgv_dashboard_latest.html

          cp \
            reports/streamlit_snapshot_latest.json \
            site/dashboard/reports/streamlit_snapshot_latest.json

          cp \
            reports/streamlit_snapshot_latest.json \
            site/reports/streamlit_snapshot_latest.json

          echo "Dashboard et snapshot copiés dans le site."

      # ============================================================
      # 13. Vérification de la copie
      # ============================================================

      - name: Verify copied snapshot
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import sys

          from pathlib import Path


          SOURCE_PATH = Path(
              "reports/streamlit_snapshot_latest.json"
          )

          PUBLISHED_PATH = Path(
              "site/reports/streamlit_snapshot_latest.json"
          )


          def fail(message: str) -> None:
              print(f"::error::{message}")
              sys.exit(1)


          if not SOURCE_PATH.exists():
              fail(
                  "Le snapshot source est absent : "
                  f"{SOURCE_PATH}"
              )

          if not PUBLISHED_PATH.exists():
              fail(
                  "Le snapshot destiné à la publication est absent : "
                  f"{PUBLISHED_PATH}"
              )

          try:
              with SOURCE_PATH.open(
                  "r",
                  encoding="utf-8",
              ) as file:
                  source_snapshot = json.load(file)

              with PUBLISHED_PATH.open(
                  "r",
                  encoding="utf-8",
              ) as file:
                  published_snapshot = json.load(file)

          except Exception as error:
              fail(
                  "Impossible de comparer les snapshots : "
                  f"{error}"
              )

          source_timestamp = (
              source_snapshot.get("timestamp_utc")
              or source_snapshot.get("generated_at_utc")
          )

          published_timestamp = (
              published_snapshot.get("timestamp_utc")
              or published_snapshot.get("generated_at_utc")
          )

          print(f"Timestamp source  : {source_timestamp}")
          print(f"Timestamp publié : {published_timestamp}")

          if source_timestamp != published_timestamp:
              fail(
                  "Le timestamp du snapshot publié ne correspond "
                  "pas au snapshot généré."
              )

          if source_snapshot != published_snapshot:
              fail(
                  "Le contenu du snapshot publié ne correspond pas "
                  "au snapshot généré."
              )

          print("La copie du snapshot est conforme.")
          PY

      # ============================================================
      # 14. Résumé des fichiers publiés
      # ============================================================

      - name: Display publication summary
        run: |
          set -euo pipefail

          echo "Contenu du site à publier :"

          find site \
            -maxdepth 4 \
            -type f \
            -printf "%p | %s octets\n" \
            | sort

      # ============================================================
      # 15. Configuration de GitHub Pages
      # ============================================================

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # ============================================================
      # 16. Création de l'artefact GitHub Pages
      # ============================================================

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Déploiement GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ============================================================
      # 17. Déploiement GitHub Pages
      # ============================================================

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ============================================================
      # 18. Réveil de l'application Streamlit
      # ============================================================

      - name: Wake Streamlit monitoring application
        env:
          STREAMLIT_APP_URL: "https://lgv-sea-monitoring-meteo-gc.streamlit.app/"
        run: |
          set +e

          echo "Attente de la propagation GitHub Pages..."
          sleep 30

          echo "Réveil de l'application Streamlit :"
          echo "$STREAMLIT_APP_URL"

          HTTP_CODE="$(
            curl \
              --location \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              --max-time 120 \
              --retry 2 \
              --retry-delay 10 \
              "$STREAMLIT_APP_URL"
          )"

          CURL_STATUS=$?

          echo "Code HTTP Streamlit : $HTTP_CODE"

          if [ "$CURL_STATUS" -ne 0 ]; then
            echo "::warning::La requête vers Streamlit a échoué."
          elif [ "$HTTP_CODE" -ge 400 ]; then
            echo "::warning::Streamlit a répondu avec le code HTTP $HTTP_CODE."
          else
            echo "Application Streamlit réveillée avec succès."
          fi

          exit 0
