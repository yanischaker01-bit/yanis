         *  reports/streamlit_snapshot_lates*.json \
            site/dashboard*reports/streamlit_snapshot_latest.*son

          cp \
            re*orts/streamlit_snapshot_latest.jso* \
            site/reports/stream*it_snapshot_latest.json

         *touch site/.nojekyll

      - name* Vérification des fichiers copiés
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          source_path = Path(
              "reports/streamlit_snapshot_latest.json"
          )

          published_path = Path(
              "site/reports/streamlit_snapshot_latest.json"
          )

          if not source_path.exists():
              print("::error::Le snapshot source est absent.")
              sys.exit(1)

          if not published_path.exists():
              print("::error::Le snapshot publié est absent.")
              sys.exit(1)

          if source_path.stat().st_size == 0:
              print("::error::Le snapshot source est vide.")
              sys.exit(1)

          if published_path.stat().st_size == 0:
              print("::error::Le snapshot publié est vide.")
              sys.exit(1)

          try:
              with source_path.open(
                  "r",
                  encoding="utf-8",
              ) as file:
                  source = json.load(file)

              with published_path.open(
                  "r",
                  encoding="utf-8",
              ) as file:
                  published = json.load(file)
          except (json.JSONDecodeError, OSError) as error:
              print(
                  f"::error::Erreur de lecture JSON : {error}"
              )
              sys.exit(1)

          source_timestamp = source.get("timestamp_utc")
          published_timestamp = published.get("timestamp_utc")

          print(f"Timestamp source : {source_timestamp}")
          print(f"Timestamp publication : {published_timestamp}")

          if source_timestamp != published_timestamp:
              print(
                  "::error::Le snapshot publié ne correspond pas "
                  "au snapshot généré."
              )
              sys.exit(1)

          source_hash = hashlib.sha256(
              source_path.read_bytes()
          ).hexdigest()

          published_hash = hashlib.sha256(
              published_path.read_bytes()
          ).hexdigest()

          print(f"Empreinte source : {source_hash}")
          print(f"Empreinte publiée : {published_hash}")

          if source_hash != published_hash:
              print(
                  "::error::Les fichiers source et publié "
                  "sont différents."
              )
              sys.exit(1)

          print("Copie du snapshot vérifiée.")
          PY

      - name: Vérification du contenu à publier
        shell: bash
        run: |
          set -euo pipefail

          echo "Contenu du répertoire site :"
          find site -maxdepth 5 -type f -print | sort

          if [ ! -s "site/dashboard/index.html" ]; then
            echo "::error::Le fichier site/dashboard/index.html est absent."
            exit 1
          fi

          if [ ! -s "site/reports/streamlit_snapshot_latest.json" ]; then
            echo "::error::Le snapshot destiné à Streamlit est absent."
            exit 1
          fi

      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Téléversement de l'artifact GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publication GitHub Pages
    runs-on: ubuntu-latest
    needs:
      - build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Déploiement vers GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Attente de la propagation GitHub Pages
        run: |
          sleep 15

      - name: Vérification du snapshot publié
        shell: bash
        env:
          SNAPSHOT_URL: "https://yanischaker01-bit.github.io/yanis/reports/streamlit_snapshot_latest.json"
        run: |
          set -u

          echo "Vérification du snapshot publié : $SNAPSHOT_URL"

          SNAPSHOT_AVAILABLE="false"

          for attempt in 1 2 3 4 5; do
            echo "Tentative $attempt sur 5..."

            if curl \
              --location \
              --fail \
              --silent \
              --show-error \
              --max-time 60 \
              --output published_snapshot.json \
              "$SNAPSHOT_URL"
            then
              if python -m json.tool \
                published_snapshot.json \
                > /dev/null
              then
                echo "Le snapshot publié est accessible et valide."
                SNAPSHOT_AVAILABLE="true"
                break
              else
                echo "::warning::Le fichier publié n'est pas un JSON valide."
              fi
            else
              echo "::warning::Le snapshot n'est pas encore accessible."
            fi

            if [ "$attempt" -lt 5 ]; then
              sleep 15
            fi
          done

          if [ "$SNAPSHOT_AVAILABLE" != "true" ]; then
            echo "::warning::Le snapshot publié n'est pas encore accessible après cinq tentatives."
          fi

      - name: Réveil de l'application Streamlit
        shell: bash
        env:
          STREAMLIT_APP_URL: "https://lgv-sea-monitoring-meteo-gc.streamlit.app/"
        run: |
          set -u

          echo "Réveil de l'application Streamlit : $STREAMLIT_APP_URL"

          curl \
            --location \
            --silent \
            --show-error \
            --max-time 120 \
            --retry 2 \
            --retry-delay 10 \
            "$STREAMLIT_APP_URL" \
            > /dev/null \
            || echo "::warning::L'application Streamlit n'a pas répondu."
