name: GPS terrain et PK metrique v3.78

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correction:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifier les fichiers
        run: |
          test -f index_v3.html || {
            echo "ERREUR : index_v3.html introuvable"
            exit 1
          }

          test -f corriger_gps_terrain_v377.py || {
            echo "ERREUR : corriger_gps_terrain_v377.py introuvable"
            exit 1
          }

          test -f corriger_pk_metrique_v378.py || {
            echo "ERREUR : corriger_pk_metrique_v378.py introuvable"
            exit 1
          }

      - name: Verifier les scripts
        run: |
          python -m py_compile corriger_gps_terrain_v377.py
          python -m py_compile corriger_pk_metrique_v378.py

      - name: Appliquer la correction GPS terrain
        run: |
          python corriger_gps_terrain_v377.py

      - name: Appliquer la correction PK metrique
        run: |
          python corriger_pk_metrique_v378.py

      - name: Verifier le HTML complet
        run: |
          grep -q "v3.78-pk-metrique" index_v3.html || {
            echo "ERREUR : version v3.78 absente"
            exit 1
          }

          grep -q "GPS TERRAIN v3.77" index_v3.html || {
            echo "ERREUR : correction GPS terrain absente"
            exit 1
          }

          grep -q "_pkMetricCache=new Map()" index_v3.html || {
            echo "ERREUR : cache PK metrique absent"
            exit 1
          }

          grep -q "_nearestPkMetric" index_v3.html || {
            echo "ERREUR : recherche PK metrique absente"
            exit 1
          }

          grep -q "zoom:20" index_v3.html || {
            echo "ERREUR : zoom technique absent"
            exit 1
          }

          grep -q "secours 100 m" index_v3.html || {
            echo "ERREUR : statut PK 100 m absent"
            exit 1
          }

          grep -q "PK métrique indisponible" index_v3.html || {
            echo "ERREUR : avertissement terrain absent"
            exit 1
          }

          echo "HTML GPS terrain et PK metrique valide"

      - name: Enregistrer dans main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index_v3.html

          if git diff --cached --quiet; then
            echo "Aucune modification detectee"
          else
            git commit -m "GPS terrain et detection PK metrique v3.78"
            git push origin HEAD:main
          fi
